openapi: 3.1.0
info:
  title: SmartHive Internal Model Invocation API
  version: 1.0.0
  description: 'Internal Dashboard invocation schema used during the APIM migration. It is

    not the API product delivered to business consumers. APIM Product

    subscriptions are the production access and token-counter boundary.

    '
servers:
- url: http://localhost:8000
security:
- sessionCookie: []
paths:
  /api/v1/model-gateway/images/generations:
    post:
      summary: Generate Image
      operationId: generate_image_api_v1_model_gateway_images_generations_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: ./openapi.yaml#/components/schemas/ImageInvocationRequest
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ImageInvocationResponse
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/HTTPValidationError
      security:
      - sessionCookie: []
  /api/v1/model-gateway/invoke:
    post:
      summary: Invoke Model
      operationId: invoke_model_api_v1_model_gateway_invoke_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: ./openapi.yaml#/components/schemas/ModelInvocationRequest
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ModelInvocationResponse
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/HTTPValidationError
      security:
      - sessionCookie: []
  /api/v1/model-management:
    get:
      operationId: getModelRegistry
      summary: List providers, gateways, runtimes, and models
      responses:
        '200':
          description: Redacted model registry; credential plaintext is never returned
  /api/v1/model-gateway/decision:
    post:
      summary: Invoke Decision
      operationId: invoke_decision_api_v1_model_gateway_decision_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: ./openapi.yaml#/components/schemas/DecisionInvocationRequest
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/DecisionInvocationResponse
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/HTTPValidationError
      security:
      - sessionCookie: []
components:
  securitySchemes:
    sessionCookie:
      $ref: ./openapi.yaml#/components/securitySchemes/sessionCookie
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    InvocationMetadata:
      properties:
        organization_id:
          type: string
          maxLength: 255
          minLength: 1
        organization:
          type: string
          maxLength: 255
          minLength: 1
        department_id:
          type: string
          maxLength: 255
          minLength: 1
        department:
          type: string
          maxLength: 255
          minLength: 1
        project_id:
          type: string
          maxLength: 255
          minLength: 1
        project:
          type: string
          maxLength: 255
          minLength: 1
        agent_id:
          type: string
          maxLength: 255
          minLength: 1
        agent:
          type: string
          maxLength: 255
          minLength: 1
        user_id:
          type: string
          maxLength: 255
          minLength: 1
        user:
          type: string
          maxLength: 255
          minLength: 1
        workflow:
          type: string
          maxLength: 255
          minLength: 1
        model_id:
          type: string
          maxLength: 255
          minLength: 1
        model:
          type: string
          maxLength: 255
          minLength: 1
          description: Model UUID, model key, display name, or `default`.
        runtime:
          type: string
          maxLength: 255
          minLength: 1
          description: Runtime UUID, runtime name, or `default`.
        request_source:
          type: string
          maxLength: 255
          minLength: 1
        usage_domain:
          type: string
          enum:
          - apim
          - github_copilot
          default: apim
        run_id:
          type: string
          maxLength: 255
          minLength: 1
        turn_index:
          type: integer
          minimum: 1.0
          default: 1
      additionalProperties: false
      type: object
      required:
      - organization_id
      - organization
      - department_id
      - department
      - project_id
      - project
      - agent_id
      - agent
      - user_id
      - user
      - workflow
      - model_id
      - model
      - runtime
      - request_source
      - run_id
    ToolFunctionDefinition:
      properties:
        name:
          type: string
          maxLength: 64
          minLength: 1
        description:
          type: string
          minLength: 1
          maxLength: 4000
        parameters:
          additionalProperties: true
          type: object
      additionalProperties: false
      type: object
      required:
      - name
      - description
      - parameters
    ToolDefinition:
      properties:
        type:
          type: string
          const: function
          default: function
        function:
          $ref: '#/components/schemas/ToolFunctionDefinition'
      additionalProperties: false
      type: object
      required:
      - function
    ToolFunctionCall:
      properties:
        name:
          type: string
          maxLength: 64
          minLength: 1
        arguments:
          type: string
          maxLength: 100000
          default: '{}'
      additionalProperties: false
      type: object
      required:
      - name
    ToolCall:
      properties:
        id:
          type: string
          maxLength: 255
          minLength: 1
        type:
          type: string
          const: function
          default: function
        function:
          $ref: '#/components/schemas/ToolFunctionCall'
      additionalProperties: false
      type: object
      required:
      - id
      - function
    ChatMessage:
      properties:
        role:
          type: string
          enum:
          - system
          - user
          - assistant
          - tool
        content:
          type:
          - string
          - 'null'
          maxLength: 200000
        tool_calls:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ToolCall'
          maxItems: 20
        tool_call_id:
          type:
          - string
          - 'null'
          maxLength: 255
          minLength: 1
      additionalProperties: false
      type: object
      required:
      - role
      description: 'One turn in an OpenAI-shaped conversation.


        `content` is optional because an assistant turn that only calls tools carries no

        text, and a `tool` turn carries the result of exactly one call. The validator below

        is what keeps that from degrading into "any field may be missing".'
    ModelInvocationRequest:
      properties:
        metadata:
          $ref: '#/components/schemas/InvocationMetadata'
        runtime_id:
          type:
          - string
          - 'null'
          format: uuid
        model_id:
          type:
          - string
          - 'null'
          format: uuid
        gateway_profile_id:
          type:
          - string
          - 'null'
          format: uuid
        gateway_deployment_id:
          type:
          - string
          - 'null'
          format: uuid
        messages:
          items:
            $ref: '#/components/schemas/ChatMessage'
          type: array
          maxItems: 100
          minItems: 1
        tools:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ToolDefinition'
          maxItems: 32
        temperature:
          type:
          - number
          - 'null'
          maximum: 2
          minimum: 0
        max_output_tokens:
          type:
          - integer
          - 'null'
          maximum: 1000000
          minimum: 1
        response_format:
          anyOf:
          - type: string
            const: json_object
          - type: 'null'
        stream:
          type: boolean
          default: false
          description: Provider streaming is consumed and returned as one normalized response.
        api_format:
          anyOf:
          - $ref: '#/components/schemas/InvocationApiFormat'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - metadata
      - messages
      allOf:
      - if:
          required:
          - gateway_profile_id
          properties:
            gateway_profile_id:
              type: string
        then:
          required:
          - model_id
          - gateway_deployment_id
          properties:
            model_id:
              type: string
              format: uuid
            gateway_deployment_id:
              type: string
              format: uuid
      - if:
          required:
          - gateway_deployment_id
          properties:
            gateway_deployment_id:
              type: string
        then:
          required:
          - model_id
          - gateway_profile_id
          properties:
            model_id:
              type: string
              format: uuid
            gateway_profile_id:
              type: string
              format: uuid
    InvocationUsage:
      properties:
        input_tokens:
          type: integer
          minimum: 0.0
        cached_tokens:
          type: integer
          minimum: 0.0
        cache_write_tokens:
          type: integer
          minimum: 0.0
          default: 0
        output_tokens:
          type: integer
          minimum: 0.0
        estimated:
          type: boolean
      additionalProperties: false
      type: object
      required:
      - input_tokens
      - cached_tokens
      - output_tokens
      - estimated
    ModelInvocationResponse:
      properties:
        request_id:
          type: string
        correlation_id:
          type:
          - string
          - 'null'
          description: Actual Gateway correlation ID, never a fallback caller or upstream ID.
        upstream_request_id:
          type:
          - string
          - 'null'
        content:
          type: string
        tool_calls:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ToolCall'
        provider:
          type: string
        runtime:
          type: string
        model:
          type: string
        gateway:
          type: string
        gateway_profile_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        gateway_deployment_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        native_gateway_id:
          anyOf:
          - type: string
          - type: 'null'
        latency_ms:
          type: integer
          minimum: 0.0
        usage:
          anyOf:
          - $ref: '#/components/schemas/InvocationUsage'
          - type: 'null'
          oneOf:
          - $ref: '#/components/schemas/InvocationUsage'
          - type: 'null'
        estimated_cost:
          type:
          - number
          - 'null'
          minimum: 0
        selected_model_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        selected_model_name:
          anyOf:
          - type: string
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - request_id
      - content
      - provider
      - runtime
      - model
      - gateway
      - latency_ms
      - usage
    InvocationApiFormat:
      type: string
      enum:
      - openai_chat
      - openai_responses
      - anthropic_messages
      title: InvocationApiFormat
x-gateway-adapters:
  internal-schema: ModelInvocationRequest
  implementations:
  - apim
  - litellm
  - direct
