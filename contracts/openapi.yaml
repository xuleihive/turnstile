openapi: 3.1.0
info:
  title: Token Observability API
  version: 0.1.0
  description: 'Phase 1 INFORM contract for the Token Observability dashboard and usage

    processor. Query responses contain token counts and metadata only. Prompt

    and completion content are absent from usage queries. Authenticated image invocation
    accepts a transient provider payload and returns an image without storing its content.

    '
servers:
- url: http://localhost:8000
  description: Local development
security:
- sessionCookie: []
tags:
- name: Authentication
  description: Password and Microsoft sign-in backed by an HTTP-only session cookie.
- name: Overview
- name: Trends
- name: Runs
- name: Audit
- name: Optimization
- name: Budgets
  description: Monthly soft Token allocation, utilization, forecast, and audit history.
- name: Application Access
  description: APIM consumer inventory, attribution, Ledger-backed quotas, and Owner-managed lifecycle metadata.
- name: GitHub Copilot
  description: 'Organization Copilot subscription, usage metrics, AI-credit billing, explicit

    application-user identity mapping, and reviewed personal budget requests.

    '
- name: Anomaly Rules
  description: Authenticated rule visibility with Owner-managed configuration.
- name: Assistant
  description: 'Natural-language analysis over the same repository the dashboard reads, and the

    pinned reports it produces. Charts are authored by tools, never by the model.

    '
- name: Model Control Plane
  description: Owner-only desired-state publication to isolated APIM revisions.
- name: Model Gateway
  description: Authenticated, assigned and budget-governed internal model invocation.
- name: Model Router
  description: User-scoped model routing drafts, validation, version publication, and lifecycle.
- name: User Settings
  description: Private current-account self service.
- name: Organization Management
  description: Persistent APIM directory, department delegation and reviewed read-only Entra synchronization.
- name: Permission Management
  description: Owner-only revisioned four-role menu configuration; automatic row scopes are not editable.
