paths:
  /api/v1/model-management:
    get:
      summary: Get Model Registry
      operationId: get_model_registry_api_v1_model_management_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/RegistryResponse
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/HTTPValidationError
      security:
      - sessionCookie: []
  /api/v1/model-management/model-availability:
    get:
      summary: Read desired and verified model availability
      operationId: listModelAvailability
      responses:
        '200':
          description: Model availability snapshots
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/ModelAvailabilityList
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '401':
          description: Authentication required
        '403':
          description: Owner session required
        '503':
          description: Model availability storage is unavailable
      security:
      - sessionCookie: []
      description: Owner-only consistent state and latest operation snapshot. Unknown or stale target
        coverage never becomes verified success.
      tags:
      - Model Control Plane
  /api/v1/model-management/models/{item_id}/availability:
    get:
      summary: Read one model's desired and verified state
      operationId: getModelAvailability
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Item Id
      responses:
        '200':
          description: Latest desired state and independent effective evidence
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/ModelAvailabilityReadback
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/HTTPValidationError
        '401':
          description: Authentication required
        '403':
          description: Owner session required
        '404':
          description: Unknown model availability identity
        '503':
          description: Model availability storage is unavailable
      security:
      - sessionCookie: []
      tags:
      - Model Control Plane
    put:
      summary: Submit an idempotent versioned model availability command
      operationId: changeModelAvailability
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Item Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/ModelAvailabilityCommand
      responses:
        '202':
          description: Versioned operation accepted or exact intent replayed
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/ModelAvailabilityAccepted
          headers:
            Location:
              schema:
                type: string
              description: Relative status URL for the same operation
            Cache-Control:
              schema:
                type: string
                const: no-store
        '422':
          description: Invalid strict Boolean, revision or idempotency key
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/HTTPValidationError
        '401':
          description: Authentication required
        '403':
          description: Owner session and allowed write origin required
        '409':
          description: Stale revision, conflicting intent, pending operation or removal
        '503':
          description: Availability storage or complete target coverage unavailable
      security:
      - sessionCookie: []
      description: Requires fresh coverage of every target, the current expected revision and a unique
        intent key. Returns an accepted operation, not effective success. Does not modify prices, default
        selection, assignments or budgets. Ordinary model PUT cannot change enabled.
      tags:
      - Model Control Plane
  /api/v1/model-management/model-availability/operations/{operation_id}:
    get:
      summary: Read an immutable availability intent and its observed progress
      operationId: getModelAvailabilityOperation
      parameters:
      - name: operation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Operation Id
      responses:
        '200':
          description: Operation and per-target evidence
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/ModelAvailabilityOperation
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/HTTPValidationError
        '401':
          description: Authentication required
        '403':
          description: Owner session required
        '404':
          description: Unknown operation
        '503':
          description: Model availability storage is unavailable
      security:
      - sessionCookie: []
      tags:
      - Model Control Plane
  /api/v1/model-management/model-availability/operations/{operation_id}/retry:
    post:
      summary: Retry the same failed availability operation
      operationId: retryModelAvailabilityOperation
      parameters:
      - name: operation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Operation Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/ModelAvailabilityRetry
      responses:
        '202':
          description: Existing operation accepted for retry
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/ModelAvailabilityAccepted
          headers:
            Location:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
        '422':
          description: Invalid expected revision
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/HTTPValidationError
        '401':
          description: Authentication required
        '403':
          description: Owner session and allowed write origin required
        '409':
          description: Revision changed, operation ineligible or retry limit reached
        '503':
          description: Availability storage or complete target coverage unavailable
      security:
      - sessionCookie: []
      description: Retains the original operation, intent and desired revision. Requires matching current
        revision and coverage; at most three manual retries are permitted.
      tags:
      - Model Control Plane
  /api/v1/model-management/apim-targets:
    get:
      summary: List persisted APIM targets and Gateway deployments
      operationId: listApimTargetTopologies
      responses:
        '200':
          description: Enabled registered APIM targets and their active deployments.
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/ApimTargetTopologyList
        '401':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
      security:
      - sessionCookie: []
      description: Requires an authenticated session. Reads persisted inventory without ARM or inference
        requests. Declared, reachable and observed states are independent.
      tags:
      - Model Control Plane
    post:
      summary: Register an existing APIM target
      operationId: registerApimTarget
      requestBody:
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/ApimTargetWrite
        required: true
      responses:
        '201':
          description: Registered APIM target and persisted inventory.
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/ApimTargetTopology
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/HTTPValidationError
        '401':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '409':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '502':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '503':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
      security:
      - sessionCookie: []
      description: Requires an Owner session, the write-origin check and the target-registry gate. Validates
        ARM identity and a credentialed GET models probe before persisting the profile. Does not create
        Azure resources or issue inference requests.
      tags:
      - Model Control Plane
  /api/v1/model-management/apim-onboarding:
    get:
      summary: List the latest initialization operation per APIM target
      operationId: listApimOnboardingOperations
      responses:
        '200':
          description: Initialization availability and persisted operations.
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/ApimOnboardingOperations
        '401':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
      security:
      - sessionCookie: []
      description: Requires an Owner session. Reads durable task state and capability without contacting
        Azure. Credentials are never returned.
      tags:
      - Model Control Plane
    post:
      summary: Queue a confirmed initialization of an existing APIM service
      operationId: startApimOnboarding
      requestBody:
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/ApimOnboardingStart
        required: true
      responses:
        '202':
          description: Persisted initialization operation and status URL.
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/GatewayReleaseOperationAccepted
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/HTTPValidationError
        '401':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '409':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '502':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '503':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
      security:
      - sessionCookie: []
      description: Requires an Owner session and the write-origin check. Revalidates the preview hash
        before queuing. Repeating the same confirmed plan returns its existing operation; a changed plan
        is rejected. The leased worker initializes only owned API resources and enables the local target
        after budget projection and authenticated Managed Gateway readiness checks.
      tags:
      - Model Control Plane
  /api/v1/model-management/apim-onboarding/preview:
    post:
      summary: Preview a target-bound APIM initialization plan
      operationId: previewApimOnboarding
      requestBody:
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/ApimOnboardingRequest
        required: true
      responses:
        '200':
          description: Initialization plan; ready is false when blockers remain.
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/ApimOnboardingPlan
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/HTTPValidationError
        '401':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '502':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '503':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
      security:
      - sessionCookie: []
      description: Requires an Owner session and the write-origin check. Read-only validation of the existing
        APIM, reserved API identity, shared governance configuration and budget readiness. Returns exact
        generated identifiers, steps, blockers and a confirmation hash. No Azure resource or local target
        is created by preview.
      tags:
      - Model Control Plane
  /api/v1/model-management/apim-onboarding/{operation_id}/retry:
    post:
      summary: Retry the latest failed initialization with its original plan
      operationId: retryApimOnboarding
      parameters:
      - name: operation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Operation Id
      responses:
        '202':
          description: New linked operation and status URL.
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/GatewayReleaseOperationAccepted
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/HTTPValidationError
        '401':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '409':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '502':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '503':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
      security:
      - sessionCookie: []
      description: Requires an Owner session and the write-origin check. Revalidates the same preview
        hash, retains the failed operation, links retry_of and reuses the existing encrypted credentials.
        Does not silently accept changed plans or retry an older attempt.
      tags:
      - Model Control Plane
  /api/v1/model-management/apim-targets/{gateway_profile_id}:
    get:
      summary: Read one persisted APIM target topology
      operationId: getApimTargetTopology
      parameters:
      - name: gateway_profile_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Gateway Profile Id
      responses:
        '200':
          description: Registered target topology.
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/ApimTargetTopology
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/HTTPValidationError
        '401':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '404':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
      security:
      - sessionCookie: []
      tags:
      - Model Control Plane
    delete:
      summary: Remove an APIM target from Turnstile
      operationId: removeApimTarget
      parameters:
      - name: gateway_profile_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Gateway Profile Id
      responses:
        '200':
          description: Dependency preview for the removed target.
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/ApimTargetRemovalPreview
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/HTTPValidationError
        '401':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '404':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '409':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
      security:
      - sessionCookie: []
      description: Requires an Owner session and the write-origin check. Rechecks Self-hosted Gateway,
        runtime and model dependencies before retiring deployments and disabling the Gateway profile.
        Preserves target metadata and history. No Azure resource or container is deleted or modified.
      tags:
      - Model Control Plane
  /api/v1/model-management/apim-targets/{gateway_profile_id}/removal-preview:
    get:
      summary: Inspect dependencies before removing an APIM target
      operationId: previewApimTargetRemoval
      parameters:
      - name: gateway_profile_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Gateway Profile Id
      responses:
        '200':
          description: Related resources, counts and removal blockers.
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/ApimTargetRemovalPreview
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/HTTPValidationError
        '401':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '404':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
      security:
      - sessionCookie: []
      description: Requires an Owner session. Reads persisted Self-hosted Gateway, runtime and model dependencies
        without contacting or modifying Azure.
      tags:
      - Model Control Plane
  /api/v1/model-management/apim-targets/{gateway_profile_id}/self-hosted-gateway-provisions:
    post:
      summary: Create an APIM Self-hosted Gateway and associate the target API
      operationId: createSelfHostedGateway
      parameters:
      - name: gateway_profile_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Gateway Profile Id
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/SelfHostedGatewayCreate
      responses:
        '202':
          description: Durable creation accepted; inspect status_url for actual completion.
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/GatewayReleaseOperationAccepted
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/HTTPValidationError
        '409':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
      security:
      - sessionCookie: []
      description: Owner-only, same-origin, opt-in durable creation. Turnstile generates the native ID
        from the target and Idempotency-Key; the client never supplies a native ID. Repeated identical
        submissions return the same operation. The worker checks permissions and ownership, creates only
        the named child configuration, and verifies API membership. Success means configuration ready,
        not a running container. Server installation remains customer-controlled.
      tags:
      - Model Control Plane
  /api/v1/model-management/self-hosted-gateway-provisions:
    get:
      summary: List Owner-visible Gateway creation progress and failures
      operationId: listSelfHostedGatewayProvisions
      responses:
        '200':
          description: Creation capability and durable tasks; never contains bootstrap tokens.
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/SelfHostedGatewayProvisionOperations
        '401':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
      security:
      - sessionCookie: []
      tags:
      - Model Control Plane
  /api/v1/model-management/self-hosted-gateway-provisions/{operation_id}/retry:
    post:
      summary: Retry the same failed Gateway creation without changing its native ID
      operationId: retrySelfHostedGatewayProvision
      parameters:
      - name: operation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Operation Id
      responses:
        '202':
          description: Same operation requeued or already active.
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/GatewayReleaseOperationAccepted
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/HTTPValidationError
        '409':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
      security:
      - sessionCookie: []
      description: Requires an Owner session and the write-origin check. Preserves the original task identity,
        configuration and failure audit. The worker reads the existing resource before any conditional
        write; foreign resources are never adopted by this operation.
      tags:
      - Model Control Plane
  /api/v1/model-management/self-hosted-gateways/{deployment_id}/bootstrap:
    post:
      summary: Generate short-lived Gateway-specific Docker startup credentials
      operationId: getSelfHostedGatewayBootstrap
      parameters:
      - name: deployment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Deployment Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/SelfHostedGatewayBootstrapRequest
      responses:
        '200':
          description: Sensitive environment file and credential-free container commands.
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/SelfHostedGatewayBootstrap
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/HTTPValidationError
        '409':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '502':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
      security:
      - sessionCookie: []
      description: Requires an Owner session, the write-origin check and an unchanged active deployment
        owned by a succeeded creation task. Verifies the live APIM Gateway and API association. Returns
        a GatewayKey token only in the environment file, never a model subscription key. No token is persisted
        in tasks, logs or audits. Tokens last at most 720 hours. Regenerate from Turnstile for renewal;
        recreating the named container interrupts its connections.
      tags:
      - Model Control Plane
  /api/v1/model-management/apim-targets/{gateway_profile_id}/self-hosted-gateways:
    post:
      summary: Associate Self-hosted Gateway metadata with an APIM target
      operationId: addSelfHostedGateway
      parameters:
      - name: gateway_profile_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Gateway Profile Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/SelfHostedGatewayWrite
      responses:
        '201':
          description: Saved deployment metadata and persisted inventory.
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/GatewayDeploymentTopology
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/HTTPValidationError
        '401':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '404':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '409':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '503':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
      security:
      - sessionCookie: []
      description: Requires an Owner session, the write-origin check and the lifecycle feature. Records
        customer-managed hosting metadata only. Does not create or modify an Azure Gateway or container.
        New or re-added entries require fresh reachability evidence.
      tags:
      - Model Control Plane
  /api/v1/model-management/self-hosted-gateways/{deployment_id}/name:
    patch:
      summary: Change only the Self-hosted Gateway display name
      operationId: renameSelfHostedGateway
      parameters:
      - name: deployment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Deployment Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/SelfHostedGatewayNameWrite
      responses:
        '204':
          description: Display name saved; no response body.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/HTTPValidationError
        '401':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '404':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '503':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
      security:
      - sessionCookie: []
      description: Requires an Owner session, the write-origin check and lifecycle availability. Trims
        a nonblank display name. Routing, credentials, inventory and retirement state are unchanged. Returns
        a minimal acknowledgement without a post-write topology read.
      tags:
      - Model Control Plane
  /api/v1/model-management/self-hosted-gateways/{deployment_id}/removal-preview:
    get:
      summary: Preview metadata retirement blockers
      operationId: previewSelfHostedGatewayRemoval
      parameters:
      - name: deployment_id
