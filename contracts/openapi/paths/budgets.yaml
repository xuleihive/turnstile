paths:
  /api/v1/budgets/reservations:
    get:
      summary: Review Budget Reservations
      operationId: review_budget_reservations_api_v1_budgets_reservations_get
      parameters:
      - name: scope_type
        in: query
        required: true
        schema:
          enum:
          - person
          - application
          type: string
          title: Scope Type
      - name: scope_id
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
          title: Scope Id
      - name: period
        in: query
        required: true
        schema:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          title: Period
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 20
          minimum: 1
          default: 20
          title: Limit
      - name: include_resolved
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Resolved
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ../../openapi.yaml#/components/schemas/LedgerAttempt
                title: Response Review Budget Reservations Api V1 Budgets Reservations Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/HTTPValidationError
      security:
      - sessionCookie: []
  /api/v1/budgets/reservations/resolve:
    post:
      summary: Approve Budget Reservation Resolution
      operationId: approve_budget_reservation_resolution_api_v1_budgets_reservations_resolve_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/BudgetReservationResolutionWrite
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/BudgetReservationResolution
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/HTTPValidationError
      security:
      - sessionCookie: []
  /api/v1/budgets:
    get:
      summary: Get monthly organization, department, and user Token budgets
      operationId: getTokenBudgets
      parameters:
      - name: period
        in: query
        required: true
        schema:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          title: Period
      - name: include_users
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Users
      responses:
        '200':
          description: Monthly hierarchical budget state
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/TokenBudgetResponse
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/HTTPValidationError
        '401':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
      security:
      - sessionCookie: []
      description: Returns assigned limits, actual usage, remaining allowance, forecast, status, and audit
        history to any authenticated application user.
      tags:
      - Budgets
  /api/v1/budgets/users:
    get:
      summary: Search and page people budgets within one department
      operationId: getPeopleBudgets
      parameters:
      - name: period
        in: query
        required: true
        schema:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          title: Period
      - name: department_id
        in: query
        required: true
        schema:
          type: string
          title: Department Id
      - name: query
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Query
      - name: status
        in: query
        required: false
        schema:
          enum:
          - all
          - assigned
          - unallocated
          - unverified
          - healthy
          - warning
          - exceeded
          type: string
          default: all
          title: Status
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Bounded page of people budgets and department allocation totals
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/TokenBudgetPeopleResponse
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/HTTPValidationError
        '401':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '404':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
      security:
      - sessionCookie: []
      tags:
      - Budgets
  /api/v1/budgets/users/bulk:
    post:
      summary: Atomically allocate budgets to selected or all matching people
      operationId: bulkSavePeopleBudgets
      parameters:
      - name: period
        in: query
        required: true
        schema:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          title: Period
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/TokenBudgetBulkWrite
      responses:
        '200':
          description: Bulk allocation summary
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/TokenBudgetBulkResult
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/HTTPValidationError
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '404':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '409':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
      security:
      - sessionCookie: []
      tags:
      - Budgets
  /api/v1/budgets/enforcement/{department_id}:
    put:
      summary: Save Department Enforcement
      operationId: save_department_enforcement_api_v1_budgets_enforcement__department_id__put
      parameters:
      - name: department_id
        in: path
        required: true
        schema:
          type: string
          title: Department Id
      - name: period
        in: query
        required: true
        schema:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          title: Period
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/DepartmentEnforcementWrite
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/TokenBudgetResponse
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/HTTPValidationError
      security:
      - sessionCookie: []
  /api/v1/budgets/{scope_type}/{scope_id}:
    put:
      summary: Assign or update one monthly Token budget
      operationId: saveTokenBudget
      parameters:
      - name: scope_type
        in: path
        required: true
        schema:
          enum:
          - organization
          - department
          - user
          type: string
          title: Scope Type
      - name: scope_id
        in: path
        required: true
        schema:
          type: string
          title: Scope Id
      - name: period
        in: query
        required: true
        schema:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          title: Period
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/TokenBudgetWrite
      responses:
        '200':
          description: Updated monthly budget state
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/TokenBudgetResponse
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/HTTPValidationError
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '404':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '409':
          description: The allocation violates a parent or child budget constraint
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/Error
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
      security:
      - sessionCookie: []
      description: Direct child allocations may not exceed the parent budget, and a parent may not be
        reduced below its existing child allocations. Owner access only.
      tags:
      - Budgets
    delete:
      summary: Remove one monthly Token budget
      operationId: deleteTokenBudget
      parameters:
      - name: scope_type
        in: path
        required: true
        schema:
          enum:
          - organization
          - department
          - user
          type: string
          title: Scope Type
      - name: scope_id
        in: path
        required: true
        schema:
          type: string
          title: Scope Id
      - name: period
        in: query
        required: true
        schema:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          title: Period
      responses:
        '200':
          description: Updated monthly budget state
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/TokenBudgetResponse
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/HTTPValidationError
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '404':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '409':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
      security:
      - sessionCookie: []
      description: A parent budget cannot be removed while direct child budgets remain assigned. Owner
        access only.
      tags:
      - Budgets
  /api/v1/budgets/capabilities:
    get:
      summary: Get Budget Capabilities
      operationId: get_budget_capabilities_api_v1_budgets_capabilities_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/BudgetCapabilities
      security:
      - sessionCookie: []
      tags:
      - Budgets
