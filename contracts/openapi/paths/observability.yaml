paths:
  /api/v1/anomaly-rules:
    get:
      summary: List configurable anomaly rules
      operationId: listAnomalyRules
      responses:
        '200':
          description: Ordered anomaly rule catalog
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/AnomalyRuleListResponse
        '401':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
      security:
      - sessionCookie: []
      tags:
      - Anomaly Rules
    post:
      summary: Create an anomaly rule
      operationId: createAnomalyRule
      requestBody:
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/AnomalyRuleWrite
        required: true
      responses:
        '201':
          description: Created anomaly rule
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/AnomalyRule
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/HTTPValidationError
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '409':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
      security:
      - sessionCookie: []
      tags:
      - Anomaly Rules
  /api/v1/anomaly-rules/{rule_id}:
    put:
      summary: Replace an anomaly rule
      operationId: updateAnomalyRule
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Rule Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/AnomalyRuleWrite
      responses:
        '200':
          description: Updated anomaly rule
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/AnomalyRule
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/HTTPValidationError
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '404':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '409':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
      security:
      - sessionCookie: []
      tags:
      - Anomaly Rules
    delete:
      summary: Delete an anomaly rule
      operationId: deleteAnomalyRule
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Rule Id
      responses:
        '204':
          description: Anomaly rule deleted
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/HTTPValidationError
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '404':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
      security:
      - sessionCookie: []
      tags:
      - Anomaly Rules
