paths:
  /api/v1/enterprise/query-entities:
    get:
      tags: [Overview]
      operationId: getHistoricalEnterpriseEntities
      summary: Read historical query dimensions
      description: >
        Authenticated query-only directory. Combines current authorized entities with
        original archived and unknown identifiers observed in the requested UTC window.
        Current directory labels win; parent_ids preserves all in-window parent edges. Department
        restrictions intersect every requested filter in SQL. Results are not assignment
        or invocation identities and must not undergo legacy user-ID rewriting.
        directory_status filters both query facets and observability aggregates; omission
        preserves the legacy all-status API behavior. The UI explicitly defaults to active.
        Unknown history and unattributed are separate from archived managed records.
      parameters:
      - $ref: ../../openapi.yaml#/components/parameters/From
      - $ref: ../../openapi.yaml#/components/parameters/To
      - name: department_id
        in: query
        style: form
        explode: true
        schema: {type: array, maxItems: 100, items: {type: string}}
      - name: organization_id
        in: query
        style: form
        explode: true
        schema: {type: array, maxItems: 100, items: {type: string}}
      - name: user_id
        in: query
        style: form
        explode: true
        schema: {type: array, maxItems: 100, items: {type: string}}
      - name: directory_status
        in: query
        style: form
        explode: true
        schema:
          type: array
          maxItems: 4
          items: {type: string, enum: [active, archived, historical, unattributed]}
      responses:
        '200':
          description: Query dimensions within an aware window of at most 366 days.
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/UsageQueryEntityCatalog
        '401':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '422':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/anomaly-rules:
    get:
      tags:
      - Anomaly Rules
      operationId: listAnomalyRules
      summary: List configurable anomaly rules
      responses:
        '200':
          description: Ordered anomaly rule catalog
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/AnomalyRuleListResponse
        '401':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
    post:
      tags:
      - Anomaly Rules
      operationId: createAnomalyRule
      summary: Create an anomaly rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/AnomalyRuleWrite
      responses:
        '201':
          description: Created anomaly rule
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/AnomalyRule
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '409':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/anomaly-rules/{rule_id}:
    put:
      tags:
      - Anomaly Rules
      operationId: updateAnomalyRule
      summary: Replace an anomaly rule
      parameters:
      - $ref: ../../openapi.yaml#/components/parameters/AnomalyRuleId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/AnomalyRuleWrite
      responses:
        '200':
          description: Updated anomaly rule
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/AnomalyRule
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '404':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '409':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
    delete:
      tags:
      - Anomaly Rules
      operationId: deleteAnomalyRule
      summary: Delete an anomaly rule
      parameters:
      - $ref: ../../openapi.yaml#/components/parameters/AnomalyRuleId
      responses:
        '204':
          description: Anomaly rule deleted
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '404':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/observability/overview:
    get:
      tags:
      - Overview
      operationId: getOverview
      summary: Get current-day and current-month headline metrics
      parameters:
      - $ref: ../../openapi.yaml#/components/parameters/Timezone
      - $ref: ../../openapi.yaml#/components/parameters/Team
      - $ref: ../../openapi.yaml#/components/parameters/Agent
      - $ref: ../../openapi.yaml#/components/parameters/Workflow
      - $ref: ../../openapi.yaml#/components/parameters/Model
      responses:
        '200':
          description: Overview metrics and top workflows
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/OverviewResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/observability/trends:
    get:
      tags:
      - Trends
      operationId: getTrends
      summary: Get ET and token time series grouped by one attribution dimension
      parameters:
      - $ref: ../../openapi.yaml#/components/parameters/From
      - $ref: ../../openapi.yaml#/components/parameters/To
      - $ref: ../../openapi.yaml#/components/parameters/Timezone
      - name: interval
        in: query
        required: true
        schema:
          $ref: ../../openapi.yaml#/components/schemas/TimeInterval
      - name: group_by
        in: query
        required: true
        schema:
          $ref: ../../openapi.yaml#/components/schemas/TrendDimension
      - $ref: ../../openapi.yaml#/components/parameters/Team
      - $ref: ../../openapi.yaml#/components/parameters/Agent
      - $ref: ../../openapi.yaml#/components/parameters/Workflow
      - $ref: ../../openapi.yaml#/components/parameters/Model
      responses:
        '200':
          description: Stacked time-series data
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/TrendResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/observability/runs:
    get:
      tags:
      - Runs
      operationId: listRuns
      summary: List runs for the waterfall view selector
      parameters:
      - $ref: ../../openapi.yaml#/components/parameters/From
      - $ref: ../../openapi.yaml#/components/parameters/To
      - $ref: ../../openapi.yaml#/components/parameters/Team
      - $ref: ../../openapi.yaml#/components/parameters/Agent
      - $ref: ../../openapi.yaml#/components/parameters/Workflow
      - name: min_turns
        in: query
        schema:
          type: integer
          minimum: 1
      - $ref: ../../openapi.yaml#/components/parameters/Cursor
      - $ref: ../../openapi.yaml#/components/parameters/Limit
      responses:
        '200':
          description: Cursor-paginated run summaries
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/RunListResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/observability/runs/{run_id}:
    get:
      tags:
      - Runs
      operationId: getRun
      summary: Get one run and its ordered turn waterfall
      parameters:
      - $ref: ../../openapi.yaml#/components/parameters/RunId
      responses:
        '200':
          description: Run detail
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/RunDetail
        '404':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/observability/audit-findings:
    get:
      tags:
      - Audit
      operationId: listAuditFindings
      summary: List auditor findings; Phase 1 may return seeded or empty data
      parameters:
      - $ref: ../../openapi.yaml#/components/parameters/From
      - $ref: ../../openapi.yaml#/components/parameters/To
      - name: status
        in: query
        schema:
          $ref: ../../openapi.yaml#/components/schemas/AuditStatus
      - name: severity
        in: query
        schema:
          $ref: ../../openapi.yaml#/components/schemas/AuditSeverity
      - $ref: ../../openapi.yaml#/components/parameters/Workflow
      - $ref: ../../openapi.yaml#/components/parameters/Cursor
      - $ref: ../../openapi.yaml#/components/parameters/Limit
      responses:
        '200':
          description: Cursor-paginated findings
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/AuditFindingListResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/observability/audit-findings/{finding_id}:
    patch:
      tags:
      - Audit
      operationId: updateAuditFinding
      summary: Update finding workflow state; no rule evaluation is performed
      parameters:
      - $ref: ../../openapi.yaml#/components/parameters/FindingId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/AuditFindingUpdate
      responses:
        '200':
          description: Updated finding
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/AuditFinding
        '404':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/observability/optimization-events:
    get:
      tags:
      - Optimization
      operationId: listOptimizationEvents
      summary: List optimization markers and their before/after comparisons
      parameters:
      - $ref: ../../openapi.yaml#/components/parameters/Workflow
      - $ref: ../../openapi.yaml#/components/parameters/Cursor
      - $ref: ../../openapi.yaml#/components/parameters/Limit
      responses:
        '200':
          description: Optimization comparisons
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/OptimizationEventListResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
    post:
      tags:
      - Optimization
      operationId: createOptimizationEvent
      summary: Mark an optimization event for a workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/OptimizationEventCreate
      responses:
        '201':
          description: Created marker with computed comparison
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/OptimizationEvent
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
