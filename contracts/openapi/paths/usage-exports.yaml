paths:
  /api/v1/observability/export-jobs:
    post:
      tags:
      - Observability
      operationId: createUsageExportJob
      summary: Queue an analysis report and request detail export
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/UsageExportJobCreate
      responses:
        '202':
          description: Export queued or an identical idempotent job already exists
          headers:
            Location:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/UsageExportJobResponse
        '401':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '409':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '413':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '422':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '429':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
    get:
      tags:
      - Observability
      operationId: listUsageExportJobs
      summary: List export jobs visible to the current user
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: Recent visible export jobs
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/UsageExportJobList
        '401':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/observability/export-jobs/{job_id}:
    get:
      tags:
      - Observability
      operationId: getUsageExportJob
      summary: Get the status of an export job visible to the current user
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Export job state
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/UsageExportJobResponse
        '401':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '404':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/observability/export-jobs/{job_id}/download:
    get:
      tags:
      - Observability
      operationId: downloadUsageExportJob
      summary: Download a ready export job through the authenticated API
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Private ZIP archive streamed by the API
          headers:
            Content-Disposition:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '404':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '409':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '410':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '503':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
