schemas:
  BudgetStatus:
    type: string
    enum:
    - unallocated
    - healthy
    - warning
    - exceeded
  PeopleBudgetFilter:
    type: string
    enum:
    - all
    - assigned
    - unallocated
    - healthy
    - warning
    - exceeded
    default: all
  TokenBudgetWrite:
    properties:
      budget_mode:
        type: string
        enum:
        - tokens
        - usd
        default: tokens
      token_limit:
        anyOf:
        - type: integer
          minimum: 1.0
        - type: 'null'
        format: int64
        minimum: 1
      usd_limit:
        anyOf:
        - type: number
          exclusiveMinimum: 0.0
        - type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,16}|(?=[\d.]{1,19}0*$)\d{0,16}\.\d{0,2}0*$)
        - type: 'null'
      warning_threshold_percent:
        type: integer
        maximum: 100.0
        minimum: 1.0
        default: 80
    additionalProperties: false
    type: object
    title: TokenBudgetWrite
  TokenBudgetItem:
    properties:
      scope_type:
        type: string
        enum:
        - organization
        - department
        - user
      scope_id:
        type: string
      scope_name:
        type: string
      parent_scope_id:
        type:
        - string
        - 'null'
      budget_mode:
        type: string
        enum:
        - tokens
        - usd
        default: tokens
      token_limit:
        type:
        - integer
        - 'null'
        format: int64
        minimum: 1
      usd_limit:
        anyOf:
        - type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
        - type: 'null'
      warning_threshold_percent:
        type: integer
      used_tokens:
        type: integer
        minimum: 0.0
      remaining_tokens:
        type:
        - integer
        - 'null'
        format: int64
      used_usd:
        anyOf:
        - type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
        - type: 'null'
      remaining_usd:
        anyOf:
        - type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
        - type: 'null'
      forecast_usd:
        anyOf:
        - type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
        - type: 'null'
      usd_cost_available:
        anyOf:
        - type: boolean
        - type: 'null'
      unpriced_usage_count:
        type: integer
        minimum: 0.0
        default: 0
      usage_percent:
        type:
        - number
        - 'null'
        format: double
        minimum: 0
      forecast_tokens:
        type: integer
        minimum: 0.0
      forecast_percent:
        type:
        - number
        - 'null'
        format: double
        minimum: 0
      status:
        type: string
        enum:
        - unallocated
        - unverified
        - healthy
        - warning
        - exceeded
      updated_at:
        type:
        - string
        - 'null'
        format: date-time
      updated_by:
        type:
        - string
        - 'null'
      model_policy_configured:
        type: boolean
        default: false
        description: Whether an administrator explicitly configured a durable model-access policy for
          this user.
      allowed_model_ids:
        items:
          type: string
          format: uuid
        type: array
        description: Allowed managed-model IDs. An empty array with model_policy_configured=true explicitly
          denies all models.
    additionalProperties: false
    type: object
    required:
    - scope_type
    - scope_id
    - scope_name
    - parent_scope_id
    - token_limit
    - warning_threshold_percent
    - used_tokens
    - remaining_tokens
    - usage_percent
    - forecast_tokens
    - forecast_percent
    - status
    - updated_at
    - updated_by
    title: TokenBudgetItem
  TokenBudgetAuditEvent:
    properties:
      event_type:
        type: string
        const: budget
        default: budget
      id:
        type: string
        format: uuid
      period_start:
        type: string
        format: date
      scope_type:
        type: string
        enum:
        - organization
        - department
        - user
      scope_id:
        type: string
      scope_name:
        type: string
      action:
        type: string
        enum:
        - assigned
        - updated
        - removed
      previous_budget_mode:
        anyOf:
        - type: string
          enum:
          - tokens
          - usd
        - type: 'null'
      new_budget_mode:
        anyOf:
        - type: string
          enum:
          - tokens
          - usd
        - type: 'null'
      previous_token_limit:
        type:
        - integer
        - 'null'
        format: int64
        minimum: 1
      new_token_limit:
        type:
        - integer
        - 'null'
        format: int64
        minimum: 1
      previous_usd_limit:
        anyOf:
        - type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
        - type: 'null'
      new_usd_limit:
        anyOf:
        - type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
        - type: 'null'
      previous_warning_threshold_percent:
        type:
        - integer
        - 'null'
        minimum: 1
        maximum: 100
      new_warning_threshold_percent:
        type:
        - integer
        - 'null'
        minimum: 1
        maximum: 100
      changed_at:
        type: string
        format: date-time
      changed_by:
        type: string
    additionalProperties: false
    type: object
    required:
    - id
    - period_start
    - scope_type
    - scope_id
    - scope_name
    - action
    - previous_token_limit
    - new_token_limit
    - previous_warning_threshold_percent
    - new_warning_threshold_percent
    - changed_at
    - changed_by
    title: TokenBudgetAuditEvent
  UserModelAccessAuditEvent:
    properties:
      event_type:
        type: string
        const: model_access
        default: model_access
      id:
        type: string
        format: uuid
      user_id:
        type: string
      user_name:
        type: string
      previous_model_ids:
        items:
          type: string
          format: uuid
        type: array
      new_model_ids:
        items:
          type: string
          format: uuid
        type: array
      previous_model_names:
        items:
          type: string
        type: array
      new_model_names:
        items:
          type: string
        type: array
      changed_at:
        type: string
        format: date-time
      changed_by:
        type: string
    additionalProperties: false
    type: object
    required:
    - id
    - user_id
    - user_name
    - previous_model_ids
    - new_model_ids
    - previous_model_names
    - new_model_names
    - changed_at
    - changed_by
    title: UserModelAccessAuditEvent
  DepartmentEnforcement:
    properties:
      department_id:
        type: string
      department_name:
        type: string
      mode:
        type: string
        enum:
        - block
        - audit
      updated_at:
        type:
        - string
        - 'null'
        format: date-time
      updated_by:
        type:
        - string
        - 'null'
    additionalProperties: false
    type: object
    required:
    - department_id
    - department_name
    - mode
    - updated_at
    - updated_by
    title: DepartmentEnforcement
  DepartmentEnforcementAuditEvent:
    properties:
      event_type:
        type: string
        const: enforcement
        default: enforcement
      id:
        type: string
        format: uuid
      department_id:
        type: string
      department_name:
        type: string
      previous_mode:
        type:
        - string
        - 'null'
        enum:
        - block
        - audit
        - null
      new_mode:
        type: string
        enum:
        - block
        - audit
      changed_at:
        type: string
        format: date-time
      changed_by:
        type: string
    additionalProperties: false
    type: object
    required:
    - id
    - department_id
    - department_name
    - previous_mode
    - new_mode
    - changed_at
    - changed_by
    title: DepartmentEnforcementAuditEvent
  TokenBudgetRiskItem:
    properties:
      scope_type:
        type: string
        enum:
        - organization
        - department
        - user
      scope_id:
        type: string
      scope_name:
        type: string
      status:
        type: string
        enum:
        - warning
        - exceeded
      usage_percent:
        type: number
        minimum: 0.0
      forecast_percent:
        type: number
        minimum: 0.0
    additionalProperties: false
    type: object
    required:
    - scope_type
    - scope_id
    - scope_name
    - status
    - usage_percent
    - forecast_percent
    title: TokenBudgetRiskItem
  TokenBudgetResponse:
    properties:
      period:
        type: string
        pattern: ^\d{4}-(0[1-9]|1[0-2])$
      period_start:
        type: string
        format: date
      period_end:
        type: string
        format: date
      generated_at:
        type: string
        format: date-time
      items:
        items:
          $ref: ../../openapi.yaml#/components/schemas/TokenBudgetItem
        type: array
      risk_count:
        type: integer
        minimum: 0.0
      risk_items:
        items:
          $ref: ../../openapi.yaml#/components/schemas/TokenBudgetRiskItem
        type: array
        maxItems: 25
      history:
        items:
          anyOf:
          - $ref: ../../openapi.yaml#/components/schemas/TokenBudgetAuditEvent
          - $ref: ../../openapi.yaml#/components/schemas/UserModelAccessAuditEvent
          - $ref: ../../openapi.yaml#/components/schemas/DepartmentEnforcementAuditEvent
          oneOf:
          - $ref: ../../openapi.yaml#/components/schemas/TokenBudgetAuditEvent
          - $ref: ../../openapi.yaml#/components/schemas/UserModelAccessAuditEvent
          - $ref: ../../openapi.yaml#/components/schemas/DepartmentEnforcementAuditEvent
        type: array
      enforcement:
        items:
          $ref: ../../openapi.yaml#/components/schemas/DepartmentEnforcement
        type: array
      coverage:
        type: string
        enum:
        - global
        - department
        default: global
        description: Department-scoped organization rows are visible subtotals, not global limits or usage.
    additionalProperties: false
    type: object
    required:
    - period
    - period_start
    - period_end
    - generated_at
    - items
    - risk_count
    - risk_items
    - history
    - enforcement
    title: TokenBudgetResponse
  TokenBudgetPeopleResponse:
    properties:
      period:
        type: string
        pattern: ^\d{4}-(0[1-9]|1[0-2])$
      department_id:
        type: string
      department_name:
        type: string
      department_token_limit:
        type:
        - integer
        - 'null'
        format: int64
        minimum: 1
      department_allocated_tokens:
        type: integer
        minimum: 0.0
      department_available_tokens:
        type:
        - integer
        - 'null'
        format: int64
      department_usd_limit:
        anyOf:
        - type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
        - type: 'null'
      department_allocated_usd:
        anyOf:
        - type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
        - type: 'null'
      department_available_usd:
        anyOf:
        - type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
        - type: 'null'
      total:
        type: integer
        minimum: 0.0
      offset:
        type: integer
        minimum: 0.0
      limit:
        type: integer
        maximum: 200.0
        minimum: 1.0
      assigned_count:
        type: integer
        minimum: 0.0
      unallocated_count:
        type: integer
        minimum: 0.0
      risk_count:
        type: integer
        minimum: 0.0
      model_configured_count:
        type: integer
        minimum: 0.0
        default: 0
      items:
        items:
          $ref: ../../openapi.yaml#/components/schemas/TokenBudgetItem
        type: array
    additionalProperties: false
    type: object
    required:
    - period
    - department_id
    - department_name
    - department_token_limit
    - department_allocated_tokens
    - department_available_tokens
    - total
    - offset
    - limit
    - assigned_count
    - unallocated_count
    - risk_count
    - items
    title: TokenBudgetPeopleResponse
  TokenBudgetBulkWrite:
    properties:
      department_id:
        type: string
      selection:
        type: string
        enum:
        - ids
        - all_matching
        default: ids
      user_ids:
        items:
          type: string
        type: array
        maxItems: 500
      query:
        type:
        - string
        - 'null'
        maxLength: 200
      status:
        type: string
        enum:
        - all
        - assigned
        - unallocated
        - unverified
        - healthy
        - warning
        - exceeded
        default: all
      allocation_mode:
        type: string
        enum:
        - fixed
        - equal_remaining
        - preserve
        default: fixed
        description: preserve leaves monthly Token budgets unchanged and requires model_ids.
      budget_mode:
        type: string
        enum:
        - tokens
        - usd
        default: tokens
      token_limit:
        type:
        - integer
        - 'null'
        minimum: 1
        format: int64
      usd_limit:
        anyOf:
        - type: number
          exclusiveMinimum: 0.0
        - type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,16}|(?=[\d.]{1,19}0*$)\d{0,16}\.\d{0,2}0*$)
        - type: 'null'
      warning_threshold_percent:
        type: integer
        maximum: 100.0
        minimum: 1.0
        default: 80
      model_ids:
        type:
        - array
        - 'null'
        items:
          type: string
          format: uuid
        maxItems: 100
        description: Omit to preserve model access. An empty array explicitly denies all models.
    additionalProperties: false
    type: object
    required:
    - department_id
    title: TokenBudgetBulkWrite
  TokenBudgetBulkResult:
    properties:
      period:
        type: string
        pattern: ^\d{4}-(0[1-9]|1[0-2])$
      department_id:
        type: string
      updated_count:
        type: integer
        minimum: 1.0
      token_limit_per_user:
        type:
        - integer
        - 'null'
        minimum: 1
        format: int64
      usd_limit_per_user:
        anyOf:
        - type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,16}|(?=[\d.]{1,19}0*$)\d{0,16}\.\d{0,2}0*$)
        - type: 'null'
      total_allocated:
        type:
        - integer
        - 'null'
        minimum: 1
        format: int64
      total_usd_allocated:
        anyOf:
        - type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,16}|(?=[\d.]{1,19}0*$)\d{0,16}\.\d{0,2}0*$)
        - type: 'null'
      model_policy_updated_count:
        type: integer
        minimum: 0.0
        default: 0
    additionalProperties: false
    type: object
    required:
    - period
    - department_id
    - updated_count
    title: TokenBudgetBulkResult
  BudgetCapabilities:
    properties:
      token_available:
        type: boolean
        title: Token Available
        default: true
      usd_available:
        type: boolean
        title: Usd Available
      reason_code:
        type: string
        title: Reason Code
      message:
        type: string
        title: Message
    additionalProperties: false
    type: object
    required:
    - usd_available
    - reason_code
    - message
    title: BudgetCapabilities
