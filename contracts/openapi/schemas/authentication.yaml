schemas:
  PasswordLogin:
    properties:
      email:
        type: string
        maxLength: 320
        minLength: 3
      password:
        type: string
        maxLength: 256
        minLength: 1
    type: object
    required:
    - email
    - password
    title: PasswordLogin
  EntraLogin:
    properties:
      id_token:
        type: string
        minLength: 1
    type: object
    required:
    - id_token
    title: EntraLogin
  AuthProfile:
    type: object
    additionalProperties: false
    required:
    - id
    - email
    - name
    - role
    - method
    - session_expires_at
    properties:
      id:
        type: string
        format: uuid
      email:
        type: string
      name:
        type:
        - string
        - 'null'
      role:
        type: string
        enum:
        - owner
        - member
      method:
        type: string
        enum:
        - password
        - entra
      session_expires_at:
        type: string
        format: date-time
      avatar_url:
        type: [string, 'null']
        description: Private current-account avatar URL for password sessions; null for Microsoft sessions.
