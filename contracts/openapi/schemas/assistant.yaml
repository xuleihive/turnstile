schemas:
  PinnedChartWrite:
    properties:
      report_id:
        type:
        - string
        - 'null'
        format: uuid
        description: Absent starts a new report; present adds the chart to that one.
      title:
        type:
        - string
        - 'null'
        maxLength: 120
        minLength: 1
        description: 'Required only when starting a new report. An existing report
          already has a

          name, and letting this field rename it would make adding a chart destructive.

          '
      description:
        type: string
        maxLength: 500
        default: ''
      original_question:
        type: string
        maxLength: 4000
        minLength: 1
      chart:
        $ref: ../../openapi.yaml#/components/schemas/ChartSpec
    additionalProperties: false
    type: object
    required:
    - original_question
    - chart
    title: PinnedChartWrite
    description: 'Pin one chart.


      `report_id` decides between the two cases the dialog offers: absent means "start
      a

      new report", present means "add to that one". `title` is therefore only required
      in

      the first case — an existing report already has a name, and letting this field
      rename

      it would make adding a chart a destructive act.'
  PinnedChartRename:
    properties:
      title:
        type: string
        maxLength: 120
        minLength: 1
      description:
        type: string
        maxLength: 500
        default: ''
    additionalProperties: false
    type: object
    required:
    - title
    title: PinnedChartRename
  PinnedReportVisibilityWrite:
    properties:
      visibility:
        type: string
        enum:
        - private
        - public
    additionalProperties: false
    type: object
    required:
    - visibility
    title: PinnedReportVisibilityWrite
  PinnedChartOrder:
    properties:
      chart_ids:
        items:
          type: string
          format: uuid
        type: array
        minItems: 1
    additionalProperties: false
    type: object
    required:
    - chart_ids
    title: PinnedChartOrder
    description: 'The report''s charts in their new order. The whole list is sent
      rather than a moved

      id and an index, so the request states the outcome instead of describing an
      edit.

      '
  PinnedReportLayout:
    properties:
      version:
        type: integer
        const: 1
        default: 1
      spans:
        additionalProperties:
          type: integer
          maximum: 12.0
          minimum: 1.0
        propertyNames:
          format: uuid
        type: object
        maxProperties: 500
      row_heights:
        additionalProperties:
          type: integer
          maximum: 1400.0
          minimum: 200.0
        type: object
        maxProperties: 500
    additionalProperties: false
    type: object
    title: PinnedReportLayout
    description: Versioned canonical desktop card widths and row heights.
  PinnedChart:
    properties:
      id:
        type: string
        format: uuid
      report_id:
        type: string
        format: uuid
      original_question:
        type: string
      chart:
        $ref: ../../openapi.yaml#/components/schemas/ChartSpec
      position:
        type: integer
        minimum: 0.0
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
    additionalProperties: false
    type: object
    required:
    - id
    - report_id
    - original_question
    - chart
    - position
    - created_at
    - updated_at
    title: PinnedChart
  PinnedReport:
    properties:
      id:
        type: string
        format: uuid
      title:
        type: string
      description:
        type: string
      owner_id:
        type: string
      visibility:
        type: string
        enum:
        - private
        - public
        default: private
      can_manage:
        type: boolean
        default: false
      position:
        type: integer
        minimum: 0.0
      layout:
        $ref: ../../openapi.yaml#/components/schemas/PinnedReportLayout
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
      charts:
        items:
          $ref: ../../openapi.yaml#/components/schemas/PinnedChart
        type: array
    additionalProperties: false
    type: object
    required:
    - id
    - title
    - description
    - owner_id
    - position
    - created_at
    - updated_at
    title: PinnedReport
    description: One nav item, holding one or more charts.
  PinnedReportList:
    properties:
      items:
        items:
          $ref: ../../openapi.yaml#/components/schemas/PinnedReport
        type: array
    additionalProperties: false
    type: object
    required:
    - items
    title: PinnedReportList
  AssistantSettingsWrite:
    properties:
      model_id:
        type:
        - string
        - 'null'
        format: uuid
        description: 'The model the assistant calls. Null means automatic selection,
          which is the

          registry''s own order: the default model first, then alphabetically.

          '
      auto_title:
        type: boolean
        default: true
        description: 'Whether a new conversation is named by the model. One small
          extra call per

          thread; switching it off leaves the first question as the title.

          '
      api_format:
        type:
        - string
        - 'null'
        enum:
        - openai_chat
        - openai_responses
        - anthropic_messages
        - null
        default: null
        description: Optional API protocol. Null automatically matches the model and
          gateway route.
    additionalProperties: false
    type: object
    title: AssistantSettingsWrite
    description: What an administrator can change about how the assistant runs.
  AssistantSettings:
    properties:
      model_id:
        anyOf:
        - type: string
          format: uuid
        - type: 'null'
        title: Model Id
      auto_title:
        type: boolean
        title: Auto Title
        default: true
      effective_model_id:
        anyOf:
        - type: string
          format: uuid
        - type: 'null'
        title: Effective Model Id
      effective_model_name:
        anyOf:
        - type: string
        - type: 'null'
        title: Effective Model Name
      model_available:
        type: boolean
        title: Model Available
        default: true
      available_models:
        items:
          $ref: ../../openapi.yaml#/components/schemas/AssistantModelChoice
        type: array
        title: Available Models
      updated_at:
        anyOf:
        - type: string
          format: date-time
        - type: 'null'
        title: Updated At
      updated_by:
        anyOf:
        - type: string
        - type: 'null'
        title: Updated By
    additionalProperties: false
    type: object
    title: AssistantSettings
    description: 'The configuration plus what it actually resolves to right now.


      `effective_*` exists because the two can legitimately differ: a pinned model
      that is

      later disabled, or moved to a runtime that cannot carry tool calls, stops qualifying

      and the assistant falls back to automatic selection rather than refusing to
      answer.

      That fallback has to be visible somewhere or it is just a setting that quietly
      does

      nothing -- `model_available` is what the settings page reads to say so.


      `available_models` is served rather than derived in the browser on purpose.
      Deciding

      which models qualify is a server rule with three parts, one of which is the
      runtime''s

      tool protocol; reimplementing it client-side would let the picker offer a model
      the

      server then rejects, and the two copies would drift on the next adapter added.'
    allOf:
    - $ref: ../../openapi.yaml#/components/schemas/AssistantSettingsWrite
    - type: object
      additionalProperties: false
      properties:
        effective_model_id:
          type:
          - string
          - 'null'
          format: uuid
          description: The model that will actually be called. Null if none qualifies.
        effective_model_name:
          type:
          - string
          - 'null'
        model_available:
          type: boolean
          description: 'False when a model is pinned but no longer qualifies, so the
            assistant has

            fallen back to automatic selection. True whenever nothing is pinned.

            '
        api_available:
          type: boolean
          default: true
          description: False when a saved protocol no longer matches the effective
            model route.
        effective_api_format:
          type:
          - string
          - 'null'
          enum:
          - openai_chat
          - openai_responses
          - anthropic_messages
          - null
        effective_api_path:
          type:
          - string
          - 'null'
          description: The public gateway path used by the effective API protocol.
        available_api_formats:
          type: array
          items:
            type: string
            enum:
            - openai_chat
            - openai_responses
            - anthropic_messages
        available_models:
          type: array
          description: 'The models the assistant may be pointed at. Served rather
            than derived by

            the client because eligibility is a server rule that includes the

            runtime''s tool protocol; a second copy in the browser would offer models

            the server then rejects.

            '
          items:
            $ref: ../../openapi.yaml#/components/schemas/AssistantModelChoice
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
        updated_by:
          type:
          - string
          - 'null'
  AssistantModelChoice:
    properties:
      id:
        type: string
        format: uuid
      display_name:
        type: string
      model_key:
        type: string
      runtime_name:
        type: string
      input_cost_per_million:
        type:
        - number
        - 'null'
      output_cost_per_million:
        type:
        - number
        - 'null'
      api_formats:
        type: array
        items:
          type: string
          enum:
          - openai_chat
          - openai_responses
          - anthropic_messages
    additionalProperties: false
    type: object
    required:
    - id
    - display_name
    - model_key
    - runtime_name
    title: AssistantModelChoice
    description: 'A model the assistant is allowed to use, with what it costs to use
      it.


      The prices are here because choosing a model is a cost decision -- the registry
      spans

      $1.00 to $30.00 per million output tokens -- and a picker that hides them makes
      the

      expensive choice as easy as the cheap one.'
  InvocationApiFormat:
    type: string
    enum:
    - openai_chat
    - openai_responses
    - anthropic_messages
    title: InvocationApiFormat
