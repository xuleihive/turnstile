schemas:
  UsageRequestSummary:
    properties:
      request_id:
        type: string
      correlation_id:
        type:
        - string
        - 'null'
      trace_id:
        type:
        - string
        - 'null'
      usage_available:
        type: boolean
        default: true
        description: False means numeric usage fields are unavailable, not measured zero.
      platform_outcome:
        type:
        - string
        - 'null'
        enum:
        - dispatched
        - succeeded
        - failed
        - null
      gateway_status_code:
        type:
        - integer
        - 'null'
        maximum: 599
        minimum: 100
      upstream_request_id:
        type:
        - string
        - 'null'
      timestamp:
        type: string
        format: date-time
      organization_id:
        type: string
      organization_name:
        type: string
      department_id:
        type: string
      department_name:
        type: string
      project_id:
        type: string
      project_name:
        type: string
      agent_id:
        type: string
      agent_name:
        type: string
      user_id:
        type: string
      user_name:
        type: string
      model_id:
        type: string
      model_name:
        type: string
      request_source:
        type: string
      runtime:
        type: string
      apim_target_id:
        type:
        - string
        - 'null'
        format: uuid
      gateway_deployment_id:
        type:
        - string
        - 'null'
        format: uuid
      native_gateway_id:
        type:
        - string
        - 'null'
      native_gateway_instance_id:
        anyOf:
        - type: string
        - type: 'null'
      gateway_is_managed:
        anyOf:
        - type: boolean
        - type: 'null'
      apim_region:
        anyOf:
        - type: string
        - type: 'null'
      api_revision:
        anyOf:
        - type: string
        - type: 'null'
      prompt_tokens:
        type: integer
        minimum: 0.0
      completion_tokens:
        type: integer
        minimum: 0.0
      total_tokens:
        type: integer
        minimum: 0.0
      latency_ms:
        type: integer
        minimum: 0.0
      status_code:
        type:
        - integer
        - 'null'
        maximum: 599
        minimum: 100
      estimated_cost:
        type: number
        minimum: 0.0
      cost_available:
        type:
        - boolean
        - 'null'
      error_message:
        type:
        - string
        - 'null'
      selected_model_id:
        anyOf:
        - type: string
          format: uuid
        - type: 'null'
      selected_model_name:
        anyOf:
        - type: string
        - type: 'null'
    additionalProperties: false
    type: object
    required:
    - request_id
    - correlation_id
    - timestamp
    - organization_id
    - organization_name
    - department_id
    - department_name
    - project_id
    - project_name
    - agent_id
    - agent_name
    - user_id
    - user_name
    - model_id
    - model_name
    - request_source
    - runtime
    - prompt_tokens
    - completion_tokens
    - total_tokens
    - latency_ms
    - status_code
    - estimated_cost
    - error_message
    title: UsageRequestSummary
  UsageRequestDetail:
    properties:
      request_id:
        type: string
        title: Request Id
      correlation_id:
        anyOf:
        - type: string
        - type: 'null'
        title: Correlation Id
      trace_id:
        anyOf:
        - type: string
        - type: 'null'
        title: Trace Id
      usage_available:
        type: boolean
        title: Usage Available
        default: true
      platform_outcome:
        anyOf:
        - type: string
          enum:
          - dispatched
          - succeeded
          - failed
        - type: 'null'
        title: Platform Outcome
      gateway_status_code:
        anyOf:
        - type: integer
          maximum: 599.0
          minimum: 100.0
        - type: 'null'
        title: Gateway Status Code
      upstream_request_id:
        anyOf:
        - type: string
        - type: 'null'
        title: Upstream Request Id
      timestamp:
        type: string
        format: date-time
        title: Timestamp
      organization_id:
        type: string
        title: Organization Id
      organization_name:
        type: string
        title: Organization Name
      department_id:
        type: string
        title: Department Id
      department_name:
        type: string
        title: Department Name
      project_id:
        type: string
        title: Project Id
      project_name:
        type: string
        title: Project Name
      agent_id:
        type: string
        title: Agent Id
      agent_name:
        type: string
        title: Agent Name
      user_id:
        type: string
        title: User Id
      user_name:
        type: string
        title: User Name
      model_id:
        type: string
        title: Model Id
      model_name:
        type: string
        title: Model Name
      request_source:
        type: string
        title: Request Source
      runtime:
        type: string
        title: Runtime
      apim_target_id:
        anyOf:
        - type: string
          format: uuid
        - type: 'null'
        title: Apim Target Id
      gateway_deployment_id:
        anyOf:
        - type: string
          format: uuid
        - type: 'null'
        title: Gateway Deployment Id
      native_gateway_id:
        anyOf:
        - type: string
        - type: 'null'
        title: Native Gateway Id
      native_gateway_instance_id:
        anyOf:
        - type: string
        - type: 'null'
        title: Native Gateway Instance Id
      gateway_is_managed:
        anyOf:
        - type: boolean
        - type: 'null'
        title: Gateway Is Managed
      apim_region:
        anyOf:
        - type: string
        - type: 'null'
        title: Apim Region
      api_revision:
        anyOf:
        - type: string
        - type: 'null'
        title: Api Revision
      prompt_tokens:
        type: integer
        minimum: 0.0
        title: Prompt Tokens
      completion_tokens:
        type: integer
        minimum: 0.0
        title: Completion Tokens
      total_tokens:
        type: integer
        minimum: 0.0
        title: Total Tokens
      latency_ms:
        type: integer
        minimum: 0.0
        title: Latency Ms
      status_code:
        anyOf:
        - type: integer
          maximum: 599.0
          minimum: 100.0
        - type: 'null'
        title: Status Code
      estimated_cost:
        type: number
        minimum: 0.0
        title: Estimated Cost
      cost_available:
        anyOf:
        - type: boolean
        - type: 'null'
        title: Cost Available
      error_message:
        anyOf:
        - type: string
        - type: 'null'
        title: Error Message
      selected_model_id:
        anyOf:
        - type: string
          format: uuid
        - type: 'null'
        title: Selected Model Id
      selected_model_name:
        anyOf:
        - type: string
        - type: 'null'
        title: Selected Model Name
      provider:
        type: string
        title: Provider
      workflow:
        type: string
        title: Workflow
      run_id:
        type: string
        title: Run Id
      turn_index:
        type: integer
        minimum: 1.0
        title: Turn Index
      cached_tokens:
        type: integer
        minimum: 0.0
        title: Cached Tokens
      input_price_per_million:
        anyOf:
        - type: number
          minimum: 0.0
        - type: 'null'
        title: Input Price Per Million
      cached_price_per_million:
        anyOf:
        - type: number
          minimum: 0.0
        - type: 'null'
        title: Cached Price Per Million
      cache_write_price_per_million:
        anyOf:
        - type: number
          minimum: 0.0
        - type: 'null'
        title: Cache Write Price Per Million
      output_price_per_million:
        anyOf:
        - type: number
          minimum: 0.0
        - type: 'null'
        title: Output Price Per Million
      price_context_tier:
        anyOf:
        - type: string
        - type: 'null'
        title: Price Context Tier
      price_context_snapshot:
        anyOf:
        - additionalProperties: true
          type: object
        - type: 'null'
        title: Price Context Snapshot
      cache_write_tokens:
        type: integer
        minimum: 0.0
        title: Cache Write Tokens
        default: 0
      estimated:
        type: boolean
        title: Estimated
      ingest_source:
        type: string
        title: Ingest Source
      ingest_error:
        anyOf:
        - type: string
        - type: 'null'
        title: Ingest Error
      reconciled_at:
        anyOf:
        - type: string
          format: date-time
        - type: 'null'
        title: Reconciled At
      budget_admission:
        anyOf:
        - type: string
        - type: 'null'
        title: Budget Admission
      model_admission:
        anyOf:
        - type: string
        - type: 'null'
        title: Model Admission
    additionalProperties: false
    type: object
    required:
    - request_id
    - correlation_id
    - timestamp
    - organization_id
    - organization_name
    - department_id
    - department_name
    - project_id
    - project_name
    - agent_id
    - agent_name
    - user_id
    - user_name
    - model_id
    - model_name
    - request_source
    - runtime
    - prompt_tokens
    - completion_tokens
    - total_tokens
    - latency_ms
    - status_code
    - estimated_cost
    - error_message
    - provider
    - workflow
    - run_id
    - turn_index
    - cached_tokens
    - estimated
    - ingest_source
    title: UsageRequestDetail
    allOf:
    - $ref: ../../openapi.yaml#/components/schemas/UsageRequestSummary
    - type: object
      required:
      - provider
      - workflow
      - run_id
      - turn_index
      - cached_tokens
      - estimated
      - ingest_source
      properties:
        provider:
          type: string
        workflow:
          type: string
        run_id:
          type: string
        turn_index:
          type: integer
          minimum: 1
        cached_tokens:
          type: integer
          minimum: 0
        cache_write_tokens:
          type: integer
          minimum: 0
          default: 0
        input_price_per_million:
          type:
          - number
          - 'null'
          minimum: 0
        cached_price_per_million:
          type:
          - number
          - 'null'
          minimum: 0
        cache_write_price_per_million:
          type:
          - number
          - 'null'
          minimum: 0
        output_price_per_million:
          type:
          - number
          - 'null'
          minimum: 0
        price_context_tier:
          type:
          - string
          - 'null'
        price_context_snapshot:
          type:
          - object
          - 'null'
        estimated:
          type: boolean
        ingest_source:
          type: string
        ingest_error:
          type:
          - string
          - 'null'
        reconciled_at:
          type:
          - string
          - 'null'
          format: date-time
        budget_admission:
          type:
          - string
          - 'null'
        model_admission:
          type:
          - string
          - 'null'
  UsageRequestListResponse:
    properties:
      items:
        items:
          $ref: ../../openapi.yaml#/components/schemas/UsageRequestSummary
        type: array
      page:
        $ref: ../../openapi.yaml#/components/schemas/PageInfo
    additionalProperties: false
    type: object
    required:
    - items
    - page
    title: UsageRequestListResponse
  TimeInterval:
    type: string
    enum:
    - hour
    - day
    - week
  TrendDimension:
    type: string
    enum:
    - organization
    - department
    - project
    - agent
    - user
    - model
    - runtime
    - workflow
    - team
  AuditStatus:
    type: string
    enum:
    - new
    - acknowledged
    - resolved
    - ignored
    title: AuditStatus
  AuditSeverity:
    type: string
    enum:
    - info
    - warning
    - critical
  AnomalyRuleMetric:
    type: string
    enum:
    - error_rate_percent
    - request_latency_ms
    - request_cost_usd
    - agent_request_count
  AnomalyThresholdMode:
    type: string
    enum:
    - absolute
    - percentile
  AnomalyScopeType:
    type: string
    enum:
    - global
    - organization
    - department
    - project
    - agent
    - model
    - user
  AnomalyRuleWrite:
    properties:
      name:
        type: string
        maxLength: 120
        minLength: 1
      description:
        type: string
        maxLength: 500
        default: ''
      metric:
        type: string
        enum:
        - error_rate_percent
        - request_latency_ms
        - request_cost_usd
        - agent_request_count
      threshold_mode:
        type: string
        enum:
        - absolute
        - percentile
        default: absolute
      threshold_value:
        type: number
        exclusiveMinimum: 0.0
      minimum_sample_size:
        type: integer
        maximum: 100000.0
        minimum: 1.0
        default: 1
      severity:
        type: string
        enum:
        - warning
        - critical
        default: warning
      scope_type:
        type: string
        enum:
        - global
        - organization
        - department
        - project
        - agent
        - model
        - user
        default: global
      scope_id:
        type:
        - string
        - 'null'
        maxLength: 255
      enabled:
        type: boolean
        default: true
    additionalProperties: false
    type: object
    required:
    - name
    - metric
    - threshold_value
    title: AnomalyRuleWrite
  AnomalyRule:
    properties:
      name:
        type: string
        maxLength: 120
        minLength: 1
        title: Name
      description:
        type: string
        maxLength: 500
        title: Description
        default: ''
      metric:
        type: string
        enum:
        - error_rate_percent
        - request_latency_ms
        - request_cost_usd
        - agent_request_count
        title: Metric
      threshold_mode:
        type: string
        enum:
        - absolute
        - percentile
        title: Threshold Mode
        default: absolute
      threshold_value:
        type: number
        exclusiveMinimum: 0.0
        title: Threshold Value
      minimum_sample_size:
        type: integer
        maximum: 100000.0
        minimum: 1.0
        title: Minimum Sample Size
        default: 1
      severity:
        type: string
        enum:
        - warning
        - critical
        title: Severity
        default: warning
      scope_type:
        type: string
        enum:
        - global
        - organization
        - department
        - project
        - agent
        - model
        - user
        title: Scope Type
        default: global
      scope_id:
        anyOf:
        - type: string
          maxLength: 255
        - type: 'null'
        title: Scope Id
      enabled:
        type: boolean
        title: Enabled
        default: true
      id:
        type: string
        format: uuid
        title: Id
      created_at:
        type: string
        format: date-time
        title: Created At
      updated_at:
        type: string
        format: date-time
        title: Updated At
      updated_by:
        type: string
        title: Updated By
    additionalProperties: false
    type: object
    required:
    - name
    - metric
    - threshold_value
    - id
    - created_at
    - updated_at
    - updated_by
    title: AnomalyRule
    allOf:
    - $ref: ../../openapi.yaml#/components/schemas/AnomalyRuleWrite
    - type: object
      required:
      - id
      - created_at
      - updated_at
      - updated_by
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
  AnomalyRuleListResponse:
    properties:
      items:
        items:
          $ref: ../../openapi.yaml#/components/schemas/AnomalyRule
        type: array
    additionalProperties: false
    type: object
    required:
    - items
    title: AnomalyRuleListResponse
  MetricTotals:
    properties:
      et:
        type: number
        minimum: 0.0
      total_tokens:
        type: integer
        minimum: 0.0
      input_tokens:
        type: integer
        minimum: 0.0
      cached_tokens:
        type: integer
        minimum: 0.0
      cache_read_tokens:
        type: integer
        minimum: 0.0
        default: 0
        description: Measured cache-read bucket; unlike cached_tokens, it excludes cache writes.
      cache_write_tokens:
        type: integer
        minimum: 0.0
        default: 0
        description: Measured cache-write bucket; it is the write-only subset of cached_tokens.
      output_tokens:
        type: integer
        minimum: 0.0
      calls:
        type: integer
        minimum: 0.0
      estimated_cost:
        type: number
        minimum: 0.0
        default: 0.0
      p95_latency_ms:
        type: number
        minimum: 0.0
        default: 0.0
      failed_calls:
        type: integer
        minimum: 0.0
        default: 0
    additionalProperties: false
    type: object
    required:
    - et
    - total_tokens
    - input_tokens
    - cached_tokens
    - output_tokens
    - calls
    title: MetricTotals
  PeriodMetric:
    properties:
      from:
        type: string
        format: date-time
      to:
        type: string
        format: date-time
      totals:
        $ref: ../../openapi.yaml#/components/schemas/MetricTotals
      comparison_percent:
        type:
        - number
        - 'null'
        format: double
        description: Change versus the immediately preceding equal calendar period.
    additionalProperties: false
    type: object
    required:
    - from
    - to
    - totals
    - comparison_percent
    title: PeriodMetric
  WorkflowMetric:
    properties:
      workflow:
        type: string
      totals:
        $ref: ../../openapi.yaml#/components/schemas/MetricTotals
      share_percent:
        type: number
        maximum: 100.0
        minimum: 0.0
    additionalProperties: false
    type: object
    required:
    - workflow
    - totals
    - share_percent
    title: WorkflowMetric
  OverviewResponse:
    properties:
      as_of:
        type: string
        format: date-time
      timezone:
        type: string
      today:
        $ref: ../../openapi.yaml#/components/schemas/PeriodMetric
      month:
        $ref: ../../openapi.yaml#/components/schemas/PeriodMetric
      top_workflows:
        items:
          $ref: ../../openapi.yaml#/components/schemas/WorkflowMetric
        type: array
      unattributed_percent:
        type: number
        maximum: 100.0
        minimum: 0.0
      estimated_percent:
        type: number
        maximum: 100.0
        minimum: 0.0
    additionalProperties: false
    type: object
    required:
    - as_of
    - timezone
    - today
    - month
    - top_workflows
    - unattributed_percent
    - estimated_percent
    title: OverviewResponse
  TrendPoint:
    properties:
      bucket_start:
        type: string
        format: date-time
      key:
        type: string
      label:
        type: string
      totals:
        $ref: ../../openapi.yaml#/components/schemas/MetricTotals
    additionalProperties: false
    type: object
    required:
    - bucket_start
    - key
    - label
    - totals
    title: TrendPoint
  TrendResponse:
    properties:
      from:
        type: string
        format: date-time
      to:
        type: string
        format: date-time
      timezone:
        type: string
      interval:
        type: string
      group_by:
        type: string
      points:
        items:
          $ref: ../../openapi.yaml#/components/schemas/TrendPoint
        type: array
    additionalProperties: false
    type: object
    required:
    - from
    - to
    - timezone
    - interval
    - group_by
    - points
    title: TrendResponse
  RunSummary:
    properties:
      run_id:
        type: string
      started_at:
        type: string
        format: date-time
      ended_at:
        type: string
        format: date-time
      team:
        type: string
      user:
        type: string
      agent:
        type: string
      workflow:
        type: string
      provider:
        type: string
      models:
        items:
          type: string
        type: array
      turn_count:
        type: integer
        minimum: 1.0
      totals:
        $ref: ../../openapi.yaml#/components/schemas/MetricTotals
      latency_ms:
        type: integer
        minimum: 0.0
      estimated:
        type: boolean
    additionalProperties: false
    type: object
    required:
    - run_id
    - started_at
    - ended_at
    - team
    - user
    - agent
    - workflow
    - provider
    - models
    - turn_count
    - totals
    - latency_ms
    - estimated
    title: RunSummary
  RunTurn:
    properties:
      usage_id:
        type: string
      turn_index:
        type: integer
        minimum: 1.0
      ts:
        type: string
        format: date-time
      model:
        type: string
      input_tokens:
        type: integer
        minimum: 0.0
      cached_tokens:
        type: integer
        minimum: 0.0
      output_tokens:
        type: integer
        minimum: 0.0
      et:
        type: number
        minimum: 0.0
      et_coeff_m:
        type: number
        exclusiveMinimum: 0.0
      latency_ms:
        type: integer
        minimum: 0.0
      status:
        type: string
      estimated:
        type: boolean
      ingest_source:
        type: string
        enum:
        - eventhub
        - backfill
        - gateway
        - policy
    additionalProperties: false
    type: object
    required:
    - usage_id
    - turn_index
    - ts
    - model
    - input_tokens
    - cached_tokens
    - output_tokens
    - et
    - et_coeff_m
    - latency_ms
    - status
    - estimated
    - ingest_source
    title: RunTurn
  RunDetail:
    properties:
      run_id:
        type: string
        title: Run Id
      started_at:
        type: string
        format: date-time
        title: Started At
      ended_at:
        type: string
        format: date-time
        title: Ended At
      team:
        type: string
        title: Team
      user:
        type: string
        title: User
      agent:
        type: string
        title: Agent
      workflow:
        type: string
        title: Workflow
      provider:
        type: string
        title: Provider
      models:
        items:
          type: string
        type: array
        title: Models
      turn_count:
        type: integer
        minimum: 1.0
        title: Turn Count
      totals:
        $ref: ../../openapi.yaml#/components/schemas/MetricTotals
      latency_ms:
        type: integer
        minimum: 0.0
        title: Latency Ms
      estimated:
        type: boolean
        title: Estimated
      turns:
        items:
          $ref: ../../openapi.yaml#/components/schemas/RunTurn
        type: array
        title: Turns
    additionalProperties: false
    type: object
    required:
    - run_id
    - started_at
    - ended_at
    - team
    - user
    - agent
    - workflow
    - provider
    - models
    - turn_count
    - totals
    - latency_ms
    - estimated
    - turns
    title: RunDetail
    allOf:
    - $ref: ../../openapi.yaml#/components/schemas/RunSummary
    - type: object
      required:
      - turns
      properties:
        turns:
          type: array
          items:
            $ref: ../../openapi.yaml#/components/schemas/RunTurn
  PageInfo:
    properties:
      next_cursor:
        type:
        - string
        - 'null'
    additionalProperties: false
    type: object
    required:
    - next_cursor
    title: PageInfo
  RunListResponse:
    properties:
      items:
        items:
          $ref: ../../openapi.yaml#/components/schemas/RunSummary
        type: array
      page:
        $ref: ../../openapi.yaml#/components/schemas/PageInfo
    additionalProperties: false
    type: object
    required:
    - items
    - page
    title: RunListResponse
  AuditFinding:
    properties:
      id:
        type: string
        format: uuid
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
      rule_id:
        type: string
      severity:
        type: string
      workflow:
        type: string
      run_id:
