        format: uri
        pattern: ^https://
        description: HTTPS Chat Completions Base URL without credentials, query or fragment; requires
          api_key when creating a new Runtime.
      model_vendor:
        type: string
        enum:
        - generic
        - openai
        - anthropic
        - deepseek
        - kimi
        description: Vendor for a new OpenAI-compatible Runtime only. Existing connections retain their
          configured vendor and cannot redefine it in a publication request.
      api_key:
        type: string
        format: password
        writeOnly: true
        description: One-time Bedrock, Foundry or OpenAI-compatible provider key. It may accompany a new
          runtime or the first model on a registered API-key connection; it is encrypted on receipt and
          removed after APIM secret provisioning.
      oauth_client_secret:
        type: string
        format: password
        writeOnly: true
        minLength: 1
        maxLength: 4096
        description: One-time Databricks OAuth Secret for an existing pending OAuth connection. Encrypted
          outside the release snapshot and erased after verified Credential Manager provisioning.
  GatewayModelTarget:
    type: object
    additionalProperties: false
    description: Catalog pricing is resolved by the server before publication. Submitted rates are used
      only for manual pricing.
    properties:
      price_source:
        type: string
        enum:
        - manual
        - azure_retail
        - anthropic
        default: manual
      price_reference:
        type:
        - string
        - 'null'
        maxLength: 1000
        description: Selected flat-rate catalog entry; use context_price_references instead for tiered
          prices.
      price_discount_percent:
        type:
        - number
        - 'null'
        exclusiveMinimum: 0
        maximum: 100
        description: Percent of list price charged; 90 means a 10 percent discount. Null inherits the
          connection discount, or list price when none is set.
      price_entry_digest:
        type:
        - string
        - 'null'
        maxLength: 64
      allow_unpriced:
        type: boolean
        default: false
      operation:
        type: string
        enum:
        - chat
        - image_generation
        default: chat
        description: Image generation requires an existing Foundry deployment and three explicit prices.
      image_configuration:
        oneOf:
        - $ref: ../../openapi.yaml#/components/schemas/ImageGenerationLimits
        - type: 'null'
      deployment_name:
        type: string
        minLength: 1
        maxLength: 500
        description: Existing Foundry deployment; Turnstile derives registry identity.
      model_key:
        type: string
        minLength: 1
        maxLength: 255
        pattern: ^[a-zA-Z0-9._:-]+$
      display_name:
        type: string
        minLength: 1
        maxLength: 255
      upstream_model_id:
        type: string
        minLength: 1
        maxLength: 500
      context_window:
        type:
        - integer
        - 'null'
        minimum: 1
      input_cost_per_million:
        type:
        - number
        - 'null'
        minimum: 0
      output_cost_per_million:
        type:
        - number
        - 'null'
        minimum: 0
      cached_cost_per_million:
        type:
        - number
        - 'null'
        minimum: 0
      cache_write_cost_per_million:
        type:
        - number
        - 'null'
        minimum: 0
      context_price_references:
        type: array
        default: []
        maxItems: 32
        uniqueItems: true
        items:
          type: string
          minLength: 1
          maxLength: 1000
        description: Complete context-tier selection. The server resolves all prices and validates catalog
          or explicit custom ranges; client amounts do not set catalog prices.
      context_price_rule:
        oneOf:
        - $ref: ../../openapi.yaml#/components/schemas/ContextPriceRule
        - type: 'null'
    allOf:
    - if:
        required:
        - operation
        properties:
          operation:
            const: image_generation
      then:
        required:
        - deployment_name
        - input_cost_per_million
        - cached_cost_per_million
        - output_cost_per_million
        properties:
          deployment_name:
            type: string
            minLength: 1
            maxLength: 500
          input_cost_per_million:
            type: number
            minimum: 0
          cached_cost_per_million:
            type: number
            minimum: 0
          output_cost_per_million:
            type: number
            minimum: 0
          context_window:
            type: 'null'
          cache_write_cost_per_million:
            type: 'null'
          price_source:
            const: manual
          context_price_references:
            maxItems: 0
          context_price_rule:
            type: 'null'
    - if:
        required:
        - price_source
        properties:
          price_source:
            const: azure_retail
      then:
        anyOf:
        - required:
          - price_reference
          properties:
            price_reference:
              type: string
              pattern: '^azure_retail:'
            context_price_references:
              maxItems: 0
        - required:
          - context_price_references
          properties:
            context_price_references:
              minItems: 2
              items:
                type: string
                pattern: '^azure_retail:'
    - if:
        required:
        - price_source
        properties:
          price_source:
            const: anthropic
      then:
        anyOf:
        - required:
          - price_reference
          properties:
            price_reference:
              type: string
              pattern: '^anthropic:'
            context_price_references:
              maxItems: 0
        - required:
          - context_price_references
          properties:
            context_price_references:
              minItems: 2
              items:
                type: string
                pattern: '^anthropic:'
    - if:
        required:
        - context_price_rule
        properties:
          context_price_rule:
            type: object
      then:
        required:
        - price_source
        - context_price_references
        properties:
          price_source:
            enum:
            - azure_retail
            - anthropic
          context_price_references:
            minItems: 2
            maxItems: 2
