schemas:
  ImageGenerationLimits:
    type: object
    additionalProperties: false
    required: [max_request_bytes, max_response_bytes, output_reservation_tokens, timeout_seconds]
    description: Immutable published transport and reservation limits, not provider parameter defaults.
    properties:
      max_request_bytes: {type: integer, minimum: 1, maximum: 16777216}
      max_response_bytes: {type: integer, minimum: 1, maximum: 16777216}
      output_reservation_tokens: {type: integer, minimum: 1, maximum: 2147483647}
      timeout_seconds: {type: integer, minimum: 1, maximum: 240}
  ImageGenerationProfile:
    type: object
    additionalProperties: false
    required: [id, version, display_name, provider_kind, provider_model, protocol, api_version,
      backend_path, public_path, usage_format, max_request_bytes, max_response_bytes,
      output_reservation_tokens, timeout_seconds]
    description: Content-addressed v4 snapshot attached to an effective publication, not mutable registry metadata.
    properties:
      id: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
      version: {type: integer, const: 4}
      display_name: {type: string, minLength: 1}
      provider_kind: {type: string, const: microsoft_foundry}
      provider_model: {type: string, minLength: 1}
      protocol: {type: string, const: openai_images}
      api_version: {type: string, const: preview}
      backend_path: {type: string, const: /openai/v1/images/generations}
      public_path: {type: string, const: /images/generations}
      usage_format: {type: string, const: text-input-image-output-v1}
      max_request_bytes: {type: integer, minimum: 1, maximum: 16777216}
      max_response_bytes: {type: integer, minimum: 1, maximum: 16777216}
      output_reservation_tokens: {type: integer, minimum: 1, maximum: 2147483647}
      timeout_seconds: {type: integer, minimum: 1, maximum: 240}
  ImageInvocationMetadata:
    type: object
    additionalProperties: false
    required: [organization_id, organization, department_id, department, project_id, project,
      agent_id, agent, user_id, user, workflow, model_id, model, runtime, request_source, run_id]
    properties:
      organization_id: {type: string, minLength: 1, maxLength: 255}
      organization: {type: string, minLength: 1, maxLength: 255}
      department_id: {type: string, minLength: 1, maxLength: 255}
      department: {type: string, minLength: 1, maxLength: 255}
      project_id: {type: string, minLength: 1, maxLength: 255}
      project: {type: string, minLength: 1, maxLength: 255}
      agent_id: {type: string, minLength: 1, maxLength: 255}
      agent: {type: string, minLength: 1, maxLength: 255}
      user_id: {type: string, minLength: 1, maxLength: 255}
      user: {type: string, minLength: 1, maxLength: 255}
      workflow: {type: string, minLength: 1, maxLength: 255}
      model_id: {type: string, minLength: 1, maxLength: 255}
      model: {type: string, minLength: 1, maxLength: 255}
      runtime: {type: string, minLength: 1, maxLength: 255}
      request_source: {type: string, minLength: 1, maxLength: 255}
      usage_domain: {type: string, const: apim, default: apim}
      run_id: {type: string, minLength: 1, maxLength: 255}
      turn_index: {type: integer, minimum: 1, default: 1}
  ImageInvocationRequest:
    type: object
    additionalProperties: true
    required: [metadata, model_id, prompt]
    description: >-
      Provider JSON passthrough except for model routing and platform metadata. The selected
      model overrides any caller-supplied provider model field. No size, quality or format
      defaults are inserted. Serialized UTF-8 request bytes plus the output reservation
      are reserved before dispatch, bounded by the published v4 profile.
    properties:
      metadata:
        $ref: ../../openapi.yaml#/components/schemas/ImageInvocationMetadata
      model_id: {type: string, format: uuid}
      runtime_id: {type: [string, 'null'], format: uuid, default: null}
      prompt: {writeOnly: true, description: Provider-owned JSON prompt value.}
      size: {description: Optional provider-owned JSON value.}
      quality: {description: Optional provider-owned JSON value.}
      output_format: {description: Optional provider-owned JSON value.}
      n: {type: integer, const: 1, default: 1}
      stream: {type: boolean, const: false, default: false}
  GeneratedImage:
    type: object
    additionalProperties: false
    required: [b64_json, media_type]
    properties:
      b64_json: {type: string, contentEncoding: base64, minLength: 1, maxLength: 16777216}
      media_type: {type: string, enum: [image/png, image/jpeg, image/webp]}
  ImageInvocationUsage:
    type: object
    additionalProperties: false
    required: [input_tokens, cached_tokens, output_tokens, estimated]
    properties:
      input_tokens: {type: integer, minimum: 0}
      cached_tokens: {type: integer, minimum: 0}
      cache_write_tokens: {type: integer, minimum: 0, const: 0, default: 0}
      output_tokens: {type: integer, minimum: 0}
      estimated: {type: boolean, const: false}
  ImageInvocationResponse:
    type: object
    additionalProperties: false
    required: [request_id, correlation_id, provider, runtime, model, gateway, latency_ms,
      data, size, quality, output_format, usage]
    properties:
      request_id: {type: string}
      correlation_id: {type: string}
      provider: {type: string}
      runtime: {type: string}
      model: {type: string}
      gateway: {type: string, const: apim}
      latency_ms: {type: integer, minimum: 0}
      data:
        type: array
        minItems: 1
        maxItems: 1
        items:
          $ref: ../../openapi.yaml#/components/schemas/GeneratedImage
      size: {type: string, description: Decoded pixel dimensions.}
      quality: {type: [string, 'null']}
      output_format: {type: string, enum: [png, jpeg, webp]}
      usage:
        oneOf:
        - $ref: ../../openapi.yaml#/components/schemas/ImageInvocationUsage
        - type: 'null'
      estimated_cost: {type: [number, 'null'], minimum: 0, default: null}
  GatewayReconcileRequest:
    type: object
    additionalProperties: false
    properties:
      image_configurations:
        type: object
        default: {}
        description: Existing image model keys mapped to new limits; changes require a new publication.
        additionalProperties:
          $ref: ../../openapi.yaml#/components/schemas/ImageGenerationLimits
  ModelConnectionCreate:
    type: object
    additionalProperties: false
    required:
    - gateway_profile_id
    - provider
    oneOf:
    - required:
      - foundry_project_endpoint
      - auth_mode
    - required:
      - bedrock_runtime_url
    - required:
      - openai_base_url
      not:
        anyOf:
        - required:
          - auth_mode
        - required:
          - foundry_inference_endpoint
    - required:
      - databricks_workspace_url
      - auth_mode
    allOf:
    - if:
        required: [databricks_workspace_url]
        properties:
          databricks_workspace_url: {}
      then:
        properties:
          auth_mode: {enum: [managed_identity, oauth_m2m]}
    - if:
        required: [auth_mode]
        properties:
          auth_mode: {const: oauth_m2m}
      then:
        required: [databricks_workspace_url, oauth_client_id]
        properties:
          databricks_workspace_url: {}
          oauth_client_id: {}
      else:
        not:
          required: [oauth_client_id]
          properties:
            oauth_client_id: {}
    properties:
      gateway_profile_id:
        type: string
        format: uuid
      provider:
        $ref: ../../openapi.yaml#/components/schemas/GatewayProviderTarget
      auth_mode:
        type: string
        enum:
        - managed_identity
        - api_key
        - oauth_m2m
      foundry_project_endpoint:
        type: string
        format: uri
        description: Required Foundry Project identity for both authentication modes.
      foundry_inference_endpoint:
        type: string
        format: uri
        description: Required only for API-key mode; must use the same Foundry account.
      bedrock_runtime_url:
        type: string
        format: uri
        description: Regional Bedrock Runtime origin. No model or key is registered here.
      openai_base_url:
        type: string
        format: uri
        pattern: ^https://
        description: HTTPS Base URL without credentials, query or fragment. A trailing
          /chat/completions is normalized. No model or key is registered here.
      model_vendor:
        type: string
        enum:
        - generic
        - kimi
        - deepseek
        - openai
        - anthropic
        description: Display metadata for OpenAI-compatible connections only; not a routing rule.
      databricks_workspace_url:
        type: string
        format: uri
        description: Azure Databricks HTTPS Workspace origin without credentials, path, query, fragment or custom port. Claude uses native Anthropic Messages.
      oauth_client_id:
        type: string
        format: uuid
        description: Databricks service principal Client ID, required only for default-off OAuth M2M. No secret is collected here.
  DatabricksConnectionAdopt:
    type: object
    additionalProperties: false
    required: [workspace_url]
    properties:
      workspace_url:
        type: string
        format: uri
        description: Azure Databricks HTTPS Workspace origin for the existing native Claude models.
  ModelConnectionUpdate:
    type: object
    additionalProperties: false
    required:
    - name
    - enabled
    - is_default
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 160
      enabled:
        type: boolean
      is_default:
        type: boolean
  ModelRegistry:
    type: object
    required:
    - providers
    - gateways
    - runtimes
    - models
    properties:
      backend_pool_session_affinity_supported:
        type: boolean
        default: false
        description: Explicit opt-in support for native APIM Pool cookie affinity.
      databricks_connections_supported:
        type: boolean
        default: false
        description: API supports native Claude Workspace connections and explicit legacy adoption. Compatible Publisher is also required.
      databricks_oauth_supported:
        type: boolean
        default: false
        description: True only when Databricks OAuth M2M is explicitly enabled. Does not assert cross-tenant or token-renewal validation.
      image_generation_supported:
        type: boolean
        default: false
      image_configuration_schema_version:
        type: integer
        const: 4
      image_configuration_defaults:
        oneOf:
        - $ref: ../../openapi.yaml#/components/schemas/ImageGenerationLimits
        - type: 'null'
      providers:
        type: array
        items:
          type: object
      gateways:
        type: array
        items:
          type: object
      runtimes:
        type: array
        items:
          type: object
      models:
        type: array
        items:
          type: object
          properties:
            capabilities:
              type: array
              items:
                type: string
                enum: [chat, tools, vision, reasoning, streaming, embeddings, image_generation]
            image_profile:
              oneOf:
              - $ref: ../../openapi.yaml#/components/schemas/ImageGenerationProfile
              - type: 'null'
  GatewayPublicationCreate:
    type: object
    additionalProperties: false
    required:
    - gateway_profile_id
    - provider
    - runtime
    - model
    properties:
      gateway_profile_id:
        type: string
        format: uuid
      provider:
        $ref: ../../openapi.yaml#/components/schemas/GatewayProviderTarget
      runtime:
        $ref: ../../openapi.yaml#/components/schemas/GatewayRuntimeTarget
      model:
        $ref: ../../openapi.yaml#/components/schemas/GatewayModelTarget
  GatewayPublicationRetry:
    type: object
    additionalProperties: false
    not:
      required: [api_key, oauth_client_secret]
      properties:
        api_key: {}
        oauth_client_secret: {}
    properties:
      authorize_image_probes:
        type: boolean
        default: false
        description: Explicitly authorize a fresh bounded paid image probe attempt after a failed publication.
      api_key:
        type:
        - string
        - 'null'
        format: password
        writeOnly: true
      oauth_client_secret:
        type: [string, 'null']
        format: password
        writeOnly: true
        minLength: 1
        maxLength: 4096
        description: Replacement Databricks OAuth Secret only when retry_requires_credential is true. Never an Entra secret or PAT.
  GatewayCredentialRotation:
    type: object
    additionalProperties: false
    required:
    - model_key
    oneOf:
    - required: [api_key]
      not:
        required: [oauth_client_secret]
        properties:
          oauth_client_secret: {}
    - required: [oauth_client_secret]
      not:
        required: [api_key]
        properties:
          api_key: {}
    properties:
      model_key:
        type: string
        minLength: 1
        maxLength: 255
        pattern: ^[a-zA-Z0-9._:-]+$
      api_key:
        type: string
        format: password
        writeOnly: true
      oauth_client_secret:
        type: string
        format: password
        writeOnly: true
        minLength: 1
        maxLength: 4096
        description: Creates a new Credential Manager resource generation; effective credentials switch only after candidate promotion.
  GatewayBackendPoolMemberWrite:
    type: object
    additionalProperties: false
    required:
    - runtime_id
    - priority
    - weight
    properties:
      runtime_id:
        type: string
        format: uuid
      priority:
        type: integer
        minimum: 0
        maximum: 100
      weight:
        type: integer
        minimum: 0
        maximum: 100
  GatewayBackendFailureStatusCodeRange:
    type: object
    additionalProperties: false
    required:
    - minimum
    - maximum
    properties:
      minimum:
        type: integer
        minimum: 200
        maximum: 599
      maximum:
        type: integer
        minimum: 200
        maximum: 599
  GatewayRateLimitCircuitBreaker:
    type: object
    additionalProperties: false
    required:
    - failure_count
    - interval_seconds
    - trip_duration_seconds
    - accept_retry_after
    properties:
      failure_count:
        type: integer
        const: 1
      interval_seconds:
        type: integer
        const: 60
      trip_duration_seconds:
        type: integer
        const: 60
      accept_retry_after:
        type: boolean
        const: true
      status_code_ranges:
        type: array
        default:
        - minimum: 429
          maximum: 429
        - minimum: 408
          maximum: 408
        - minimum: 500
          maximum: 599
        items:
          $ref: ../../openapi.yaml#/components/schemas/GatewayBackendFailureStatusCodeRange
      error_reasons:
        type: array
        default:
        - BackendConnectionFailure
        - Timeout
        items:
          type: string
          enum:
          - BackendConnectionFailure
          - Timeout
  GatewayRateLimitResilience:
    type: object
    additionalProperties: false
    required:
    - max_attempts_per_request
    - retry_interval_seconds
    - first_fast_retry
    - circuit_breaker
    properties:
      max_attempts_per_request:
        type: integer
        const: 2
      retry_interval_seconds:
        type: integer
        const: 1
      first_fast_retry:
        type: boolean
        const: true
      backend_timeout_seconds:
        type: integer
        const: 120
        default: 120
      circuit_breaker:
        $ref: ../../openapi.yaml#/components/schemas/GatewayRateLimitCircuitBreaker
  GatewayBackendPoolWrite:
    type: object
    additionalProperties: false
    required:
    - members
    - rate_limit
    properties:
      session_affinity:
        type: boolean
        default: false
        description: Keep requests with the same client-held session cookie on an eligible
          Pool member. Does not change priority, weight, or failover rules.
      members:
        type: array
        minItems: 2
        maxItems: 30
        items:
          $ref: ../../openapi.yaml#/components/schemas/GatewayBackendPoolMemberWrite
      rate_limit:
        $ref: ../../openapi.yaml#/components/schemas/GatewayRateLimitResilience
  GatewayBackendPoolMember:
    type: object
    additionalProperties: false
    required:
    - runtime_id
    - runtime_name
    - backend_url
    - auth_strategy
    - priority
    - weight
    properties:
      runtime_id:
        type: string
        format: uuid
      runtime_name:
        type: string
        minLength: 1
        maxLength: 160
      backend_url:
        type: string
        format: uri
      auth_strategy:
        type: string
        enum:
        - none
        - managed_identity
        - named_value_bearer
        - named_value_api_key
      named_value_name:
        type:
        - string
        - 'null'
      priority:
        type: integer
        minimum: 0
        maximum: 100
      weight:
        type: integer
        minimum: 0
        maximum: 100
  GatewayBackendPoolConfig:
    type: object
    additionalProperties: false
    required:
    - members
    - rate_limit
    properties:
      session_affinity:
        type: boolean
        default: false
        description: Effective affinity setting; absent in legacy stored Pool JSON.
      schema_version:
        type: integer
        const: 1
        default: 1
      members:
        type: array
        minItems: 2
        maxItems: 30
        items:
          $ref: ../../openapi.yaml#/components/schemas/GatewayBackendPoolMember
      rate_limit:
        $ref: ../../openapi.yaml#/components/schemas/GatewayRateLimitResilience
  GatewayProviderTarget:
    type: object
    additionalProperties: false
    oneOf:
    - required:
      - existing_id
    - required:
      - template
    properties:
      existing_id:
        type: string
        format: uuid
      template:
        type: string
        enum:
        - amazon_bedrock
        - microsoft_foundry
        - openai_compatible
        - azure_databricks
  GatewayRuntimeTarget:
    type: object
    additionalProperties: false
    allOf:
    - not:
        required: [api_key, oauth_client_secret]
        properties:
          api_key: {}
          oauth_client_secret: {}
    - if:
        required: [oauth_client_secret]
        properties:
          oauth_client_secret: {}
      then:
        required: [existing_id]
        properties:
          existing_id: {}
    oneOf:
    - required:
      - existing_id
      not:
        anyOf:
        - required:
          - bedrock_runtime_url
        - required:
          - foundry_project_endpoint
        - required:
          - foundry_inference_endpoint
        - required:
          - openai_base_url
        - required:
          - model_vendor
    - required:
      - bedrock_runtime_url
      - api_key
      not:
        anyOf:
        - required:
          - existing_id
        - required:
          - foundry_project_endpoint
        - required:
          - foundry_inference_endpoint
        - required:
          - openai_base_url
        - required:
          - model_vendor
    - required:
      - foundry_project_endpoint
      not:
        anyOf:
        - required:
          - existing_id
        - required:
          - bedrock_runtime_url
        - required:
          - foundry_inference_endpoint
        - required:
          - api_key
        - required:
          - openai_base_url
        - required:
          - model_vendor
    - required:
      - foundry_project_endpoint
      - foundry_inference_endpoint
      - api_key
      not:
        anyOf:
        - required:
          - existing_id
        - required:
          - bedrock_runtime_url
        - required:
          - openai_base_url
        - required:
          - model_vendor
    - required:
      - openai_base_url
      - api_key
      not:
        anyOf:
        - required:
          - existing_id
        - required:
          - bedrock_runtime_url
        - required:
          - foundry_project_endpoint
        - required:
          - foundry_inference_endpoint
    properties:
      existing_id:
        type: string
        format: uuid
      bedrock_runtime_url:
        type: string
        format: uri
        description: Regional bedrock-runtime origin without a model path.
      foundry_project_endpoint:
        type: string
        format: uri
        description: Foundry Project data-plane endpoint ending in /api/projects/{project}.
      foundry_inference_endpoint:
        type: string
        format: uri
        description: Matching Foundry inference endpoint ending in /openai/v1; requires api_key.
      openai_base_url:
        type: string
        format: uri
        pattern: ^https://
        description: HTTPS Chat Completions Base URL without credentials, query or fragment;
          requires api_key when creating a new Runtime.
      model_vendor:
        type: string
        enum: [generic, openai, anthropic, deepseek, kimi]
        description: Vendor for a new OpenAI-compatible Runtime only. Existing connections
          retain their configured vendor and cannot redefine it in a publication request.
      api_key:
        type: string
        format: password
        writeOnly: true
        description: One-time Bedrock, Foundry or OpenAI-compatible provider key. It may accompany a new runtime or the first
          model on a registered API-key connection; it is encrypted on receipt and removed after APIM
          secret provisioning.
      oauth_client_secret:
        type: string
        format: password
        writeOnly: true
        minLength: 1
        maxLength: 4096
        description: One-time Databricks OAuth Secret for an existing pending OAuth connection. Encrypted outside the release snapshot and erased after verified Credential Manager provisioning.
  GatewayModelTarget:
    type: object
    additionalProperties: false
    properties:
      price_source:
        oneOf:
        - $ref: ../../openapi.yaml#/components/schemas/PriceSource
        - type: 'null'
      price_reference: {type: [string, 'null'], maxLength: 1500}
      price_discount_percent: {type: [number, 'null'], exclusiveMinimum: 0, maximum: 100}
      price_entry_digest: {type: [string, 'null'], maxLength: 64}
      allow_unpriced: {type: boolean, default: false}
      operation:
        type: string
        enum: [chat, image_generation]
        default: chat
        description: Image generation requires an existing Foundry deployment and three explicit prices.
      image_configuration:
        oneOf:
        - $ref: ../../openapi.yaml#/components/schemas/ImageGenerationLimits
        - type: 'null'
      deployment_name:
        type: string
        minLength: 1
        maxLength: 500
        description: Existing Foundry deployment; Turnstile derives registry identity.
      model_key:
        type: string
        minLength: 1
        maxLength: 255
        pattern: ^[a-zA-Z0-9._:-]+$
      display_name:
        type: string
        minLength: 1
        maxLength: 255
      upstream_model_id:
        type: string
        minLength: 1
        maxLength: 500
      context_window:
        type:
        - integer
        - 'null'
        minimum: 1
      input_cost_per_million:
        type:
        - number
        - 'null'
        minimum: 0
      output_cost_per_million:
        type:
        - number
        - 'null'
        minimum: 0
      cached_cost_per_million:
        type:
        - number
        - 'null'
        minimum: 0
      cache_write_cost_per_million:
        type:
        - number
        - 'null'
        minimum: 0
    allOf:
    - if:
        required: [operation]
        properties:
          operation: {const: image_generation}
      then:
        required: [deployment_name, input_cost_per_million, cached_cost_per_million, output_cost_per_million]
        properties:
          deployment_name: {type: string, minLength: 1, maxLength: 500}
          input_cost_per_million: {type: number, minimum: 0}
          cached_cost_per_million: {type: number, minimum: 0}
          output_cost_per_million: {type: number, minimum: 0}
          context_window: {type: 'null'}
          cache_write_cost_per_million: {type: 'null'}
  GatewayPublication:
    type: object
    additionalProperties: false
    required:
    - id
    - gateway_profile_id
    - generation
    - publication_kind
    - model_key
    - display_name
    - status
    - authorization
    - retry_requires_credential
    - attempt_count
    - created_by
    - created_at
    - updated_at
    properties:
      id:
        type: string
        format: uuid
      gateway_profile_id:
        type: string
        format: uuid
      generation:
        type: integer
        minimum: 1
      publication_kind:
        type: string
        enum:
        - model_add
        - model_remove
        - credential_rotation
        - route_reconcile
      model_key:
        type: string
      display_name:
        type: string
      status:
        type: string
        enum:
        - queued
        - validating
        - provisioning
        - building_revision
        - verifying
        - awaiting_authorization
        - promoting
        - active
        - failed
        - superseded
        - rolling_back
        - rolled_back
      error_code:
        type:
        - string
        - 'null'
      error_message:
        type:
        - string
        - 'null'
      authorization:
        oneOf:
        - $ref: ../../openapi.yaml#/components/schemas/GatewayAuthorizationRequirement
        - $ref: ../../openapi.yaml#/components/schemas/DatabricksAuthorizationRequirement
        - $ref: ../../openapi.yaml#/components/schemas/DatabricksOAuthAuthorizationRequirement
        - type: 'null'
      credential_kind:
        type: [string, 'null']
        enum: [api_key, oauth_m2m, null]
        default: null
      retry_requires_credential:
        type: boolean
        description: True when retry cannot reuse a release-owned APIM credential resource
          from persisted publication or completed provisioning evidence.
      retry_can_authorize_image_probes:
        type: boolean
        default: false
        description: Whether a failed publication can accept explicit consent for new paid image
          probes. False for non-image publications, unsupported retry kinds and the 32-attempt limit.
      attempt_count:
        type: integer
        minimum: 0
      created_by:
        type: string
      created_at:
        type: string
