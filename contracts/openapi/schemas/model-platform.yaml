schemas:
  ModelAvailabilityCommand:
    properties:
      enabled:
        type: boolean
      expected_revision:
        type: integer
        maximum: 2147483647.0
        minimum: 1.0
      idempotency_key:
        type: string
        format: uuid
    additionalProperties: false
    type: object
    required:
    - enabled
    - expected_revision
    - idempotency_key
    title: ModelAvailabilityCommand
  ModelAvailabilityRetry:
    properties:
      expected_revision:
        type: integer
        maximum: 2147483647.0
        minimum: 1.0
    additionalProperties: false
    type: object
    required:
    - expected_revision
    title: ModelAvailabilityRetry
  ModelAvailabilityTargetResult:
    properties:
      target_id:
        type: string
        format: uuid
      inventory_digest:
        type: string
        pattern: ^[0-9a-f]{64}$
      policy_digest:
        anyOf:
        - type: string
          pattern: ^[0-9a-f]{64}$
        - type: 'null'
      status:
        type: string
        enum:
        - pending
        - verified
        - failed
        - unknown
        default: pending
      observed_revision:
        anyOf:
        - type: integer
          maximum: 2147483647.0
          minimum: 1.0
        - type: 'null'
      observed_enabled:
        anyOf:
        - type: boolean
        - type: 'null'
      verified_at:
        anyOf:
        - type: string
          format: date-time
        - type: 'null'
      reason:
        anyOf:
        - type: string
          maxLength: 500
        - type: 'null'
    additionalProperties: false
    type: object
    required:
    - target_id
    - inventory_digest
    title: ModelAvailabilityTargetResult
  ModelAvailabilityOperation:
    properties:
      id:
        type: string
        format: uuid
      model_id:
        type: string
        format: uuid
      idempotency_key:
        type: string
        format: uuid
      expected_revision:
        type: integer
        maximum: 2147483647.0
        minimum: 1.0
      desired_revision:
        type: integer
        maximum: 2147483647.0
        minimum: 1.0
      desired_enabled:
        type: boolean
      created_by:
        type: string
        maxLength: 255
        minLength: 1
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
      status:
        type: string
        enum:
        - pending
        - projected
        - partial
        - succeeded
        - failed
        - unknown
        default: pending
      targets:
        items:
          $ref: ../../openapi.yaml#/components/schemas/ModelAvailabilityTargetResult
        type: array
        default: []
      projected_revision:
        anyOf:
        - type: integer
          maximum: 2147483647.0
          minimum: 1.0
        - type: 'null'
      projected_at:
        anyOf:
        - type: string
          format: date-time
        - type: 'null'
      completed_at:
        anyOf:
        - type: string
          format: date-time
        - type: 'null'
      error_code:
        anyOf:
        - type: string
        - type: 'null'
    additionalProperties: false
    type: object
    required:
    - id
    - model_id
    - idempotency_key
    - expected_revision
    - desired_revision
    - desired_enabled
    - created_by
    - created_at
    - updated_at
    title: ModelAvailabilityOperation
  ModelAvailabilityReadback:
    properties:
      model_id:
        type: string
        format: uuid
      desired_enabled:
        type: boolean
      desired_revision:
        type: integer
        maximum: 2147483647.0
        minimum: 1.0
      effective_enabled:
        anyOf:
        - type: boolean
        - type: 'null'
      effective_revision:
        anyOf:
        - type: integer
          maximum: 2147483647.0
          minimum: 1.0
        - type: 'null'
      verified_at:
        anyOf:
        - type: string
          format: date-time
        - type: 'null'
      status:
        type: string
        enum:
        - pending
        - projected
        - partial
        - succeeded
        - failed
        - unknown
        default: unknown
      command_ready:
        type: boolean
        default: false
      reason:
        anyOf:
        - type: string
        - type: 'null'
      operation:
        anyOf:
        - $ref: ../../openapi.yaml#/components/schemas/ModelAvailabilityOperation
        - type: 'null'
    additionalProperties: false
    type: object
    required:
    - model_id
    - desired_enabled
    - desired_revision
    title: ModelAvailabilityReadback
  ModelAvailabilityList:
    properties:
      items:
        items:
          $ref: ../../openapi.yaml#/components/schemas/ModelAvailabilityReadback
        type: array
    additionalProperties: false
    type: object
    required:
    - items
    title: ModelAvailabilityList
  ModelAvailabilityAccepted:
    properties:
      operation:
        $ref: ../../openapi.yaml#/components/schemas/ModelAvailabilityOperation
      status_url:
        type: string
    additionalProperties: false
    type: object
    required:
    - operation
    - status_url
    title: ModelAvailabilityAccepted
  BudgetDelegationCheck:
    properties:
      case:
        type: string
        enum:
        - valid_identity
        - wrong_audience
        - missing_person
        - current_fenced
        - candidate_fenced
      expected_status:
        type: integer
      actual_status:
        type:
        - integer
        - 'null'
      native_gateway_id:
        type:
        - string
        - 'null'
      expected_error_code:
        type:
        - string
        - 'null'
      actual_error_code:
        type:
        - string
        - 'null'
    additionalProperties: false
    type: object
    required:
    - case
    - expected_status
    - actual_status
    title: BudgetDelegationCheck
  BudgetExecutionVerificationOptions:
    properties:
      application_id:
        type: string
        format: uuid
      model_ids:
        items:
          type: string
          format: uuid
        type: array
    additionalProperties: false
    type: object
    required:
    - application_id
    - model_ids
    title: BudgetExecutionVerificationOptions
  BudgetDelegationReadiness:
    properties:
      gateway_profile_id:
        type: string
        format: uuid
      native_gateway_id:
        type: string
      revision:
        type: string
      checked_at:
        type: string
        format: date-time
      ready:
        type: boolean
      checks:
        items:
          $ref: ../../openapi.yaml#/components/schemas/BudgetDelegationCheck
        type: array
      protocol_mode:
        type: string
        enum:
        - prepared
        - paused
        - active
        default: prepared
      verification:
        anyOf:
        - $ref: ../../openapi.yaml#/components/schemas/BudgetExecutionVerificationOptions
        - type: 'null'
    additionalProperties: false
    type: object
    required:
    - gateway_profile_id
    - native_gateway_id
    - revision
    - checked_at
    - ready
    - checks
    title: BudgetDelegationReadiness
  BudgetExecutionVerificationRequest:
    properties:
      application_id:
        type: string
        format: uuid
      model_id:
        type: string
        format: uuid
    additionalProperties: false
    type: object
    required:
    - application_id
    - model_id
    title: BudgetExecutionVerificationRequest
  BudgetExecutionScopeReadback:
    properties:
      before:
        $ref: ../../openapi.yaml#/components/schemas/LedgerSummary
      after:
        anyOf:
        - $ref: ../../openapi.yaml#/components/schemas/LedgerSummary
        - type: 'null'
      attempt:
        anyOf:
        - $ref: ../../openapi.yaml#/components/schemas/LedgerAttempt
        - type: 'null'
    additionalProperties: false
    type: object
    required:
    - before
    - after
    - attempt
    title: BudgetExecutionScopeReadback
  BudgetExecutionVerification:
    properties:
      gateway_profile_id:
        type: string
        format: uuid
      native_gateway_id:
        type: string
      revision:
        type: string
      checked_at:
        type: string
        format: date-time
      request_id:
        type: string
      actual_status:
        type: integer
      invocation:
        anyOf:
        - $ref: ../../openapi.yaml#/components/schemas/ModelInvocationResponse
        - type: 'null'
      scopes:
        items:
          $ref: ../../openapi.yaml#/components/schemas/BudgetExecutionScopeReadback
        type: array
      settled:
        type: boolean
    additionalProperties: false
    type: object
    required:
    - gateway_profile_id
    - native_gateway_id
    - revision
    - checked_at
    - request_id
    - actual_status
    - invocation
    - scopes
    - settled
    title: BudgetExecutionVerification
  LedgerScope:
    properties:
      scope_type:
        type: string
        enum:
        - person
        - application
      scope_id:
        type: string
        maxLength: 255
        minLength: 1
      period_start:
        type: string
        format: date
    additionalProperties: false
    type: object
    required:
    - scope_type
    - scope_id
    - period_start
    title: LedgerScope
  LedgerSummary:
    properties:
      protocol_version:
        type: integer
        const: 2
        default: 2
      epoch:
        type: string
        format: uuid
      scope:
        $ref: ../../openapi.yaml#/components/schemas/LedgerScope
      version:
        type: integer
        minimum: 0.0
        default: 0
      policy_revision:
        type: integer
        minimum: 0.0
        default: 0
      token_limit:
        type: integer
        maximum: 9.223372036854776e+18
        minimum: 0.0
      budget_mode:
        type: string
        enum:
        - tokens
        - usd
        default: tokens
      usd_limit:
        anyOf:
        - type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,16}|(?=[\d.]{1,31}0*$)\d{0,16}\.\d{0,14}0*$)
        - type: 'null'
      enforce:
        type: boolean
      enabled:
        type: boolean
        default: true
      confirmed_tokens:
        type: integer
        maximum: 9.223372036854776e+18
        minimum: 0.0
        default: 0
      active_reserved_tokens:
        type: integer
        maximum: 9.223372036854776e+18
        minimum: 0.0
        default: 0
      upper_bound_tokens:
        type: integer
        maximum: 9.223372036854776e+18
        minimum: 0.0
        default: 0
      confirmed_usd:
        type: string
        pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,16}|(?=[\d.]{1,31}0*$)\d{0,16}\.\d{0,14}0*$)
        default: '0'
      active_reserved_usd:
        type: string
        pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,16}|(?=[\d.]{1,31}0*$)\d{0,16}\.\d{0,14}0*$)
        default: '0'
      upper_bound_usd:
        type: string
        pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,16}|(?=[\d.]{1,31}0*$)\d{0,16}\.\d{0,14}0*$)
        default: '0'
      updated_at:
        type: string
        format: date-time
    additionalProperties: false
    type: object
    required:
    - epoch
    - scope
    - token_limit
    - enforce
    - updated_at
    title: LedgerSummary
  LedgerAttemptIdentity:
    properties:
      scope:
        $ref: ../../openapi.yaml#/components/schemas/LedgerScope
      gateway_profile_id:
        type: string
        format: uuid
      native_gateway_id:
        type: string
        maxLength: 80
        minLength: 1
      correlation_id:
        type: string
        maxLength: 255
        minLength: 1
      model_id:
        type: string
        maxLength: 255
        minLength: 1
      admitted_at:
        type: string
        format: date-time
    additionalProperties: false
    type: object
    required:
    - scope
    - gateway_profile_id
    - native_gateway_id
    - correlation_id
    - model_id
    - admitted_at
    title: LedgerAttemptIdentity
  LedgerAttempt:
    properties:
      identity:
        $ref: ../../openapi.yaml#/components/schemas/LedgerAttemptIdentity
      epoch:
        type: string
        format: uuid
      state:
        type: string
        enum:
        - reserved
        - dispatching
        - uncertain
        - settled
        - upper_bound
        - cancelled
      reserved_tokens:
        type: integer
        maximum: 9.223372036854776e+18
        minimum: 1.0
      budget_mode:
        type: string
        enum:
        - tokens
        - usd
        default: tokens
      reserved_usd:
        anyOf:
        - type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,16}|(?=[\d.]{1,31}0*$)\d{0,16}\.\d{0,14}0*$)
        - type: 'null'
      actual_usd:
        anyOf:
        - type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,16}|(?=[\d.]{1,31}0*$)\d{0,16}\.\d{0,14}0*$)
        - type: 'null'
      price_snapshot:
        anyOf:
        - $ref: ../../openapi.yaml#/components/schemas/BudgetPriceProjection
        - type: 'null'
      price_etag:
        anyOf:
        - type: string
          maxLength: 255
          minLength: 1
        - type: 'null'
      actual_tokens:
        type:
        - integer
        - 'null'
        maximum: 9223372036854775807
        minimum: 0
      evidence_revision:
        type: integer
        minimum: 0.0
        default: 0
      evidence_key:
        type:
        - string
        - 'null'
        maxLength: 512
        minLength: 1
      evidence_rank:
        type: integer
        enum:
        - 0
        - 2
        - 3
        default: 0
      completion_evidence:
        type:
        - object
        - 'null'
        additionalProperties: true
      rejection_policy:
        anyOf:
        - additionalProperties: true
          type: object
        - type: 'null'
      rejection_evidence:
        anyOf:
        - additionalProperties: true
          type: object
        - type: 'null'
      resolution_evidence:
        anyOf:
        - additionalProperties: true
          type: object
        - type: 'null'
      updated_at:
        type: string
        format: date-time
    additionalProperties: false
    type: object
    required:
    - identity
    - epoch
    - state
    - reserved_tokens
    - updated_at
    title: LedgerAttempt
  RuntimeCheckSelection:
    properties:
      model_id:
        type: string
        format: uuid
      gateway_deployment_id:
        type: string
        format: uuid
    additionalProperties: false
    type: object
    required:
    - model_id
    - gateway_deployment_id
    title: RuntimeCheckSelection
  RuntimeCheckOption:
    properties:
      model_id:
        type: string
        format: uuid
      gateway_deployment_id:
        type: string
        format: uuid
      model_key:
        type: string
      model_name:
        type: string
      gateway_profile_id:
        type: string
        format: uuid
      gateway_name:
        type: string
      native_gateway_id:
        type: string
    additionalProperties: false
    type: object
    required:
    - model_id
    - gateway_deployment_id
    - model_key
    - model_name
    - gateway_profile_id
    - gateway_name
    - native_gateway_id
    title: RuntimeCheckOption
  RuntimeDiagnosticAccess:
    properties:
      status:
        type: string
        enum:
        - ready
        - missing_permissions
        - unverified
        default: unverified
      reason:
        type:
        - string
        - 'null'
        enum:
        - permission_missing
        - permission_unverified
        - identity_unavailable
        - tenant_mismatch
        - probe_subscription_unconfigured
        - null
      scope:
        type: string
      api_principal_id:
        type:
        - string
        - 'null'
        format: uuid
      tenant_id:
        type: string
        format: uuid
      subscription_id:
        type: string
        format: uuid
      resource_group:
        type: string
      apim_name:
        type: string
      probe_subscription_id:
        type: string
      required_actions:
        items:
          type: string
        type: array
      missing_actions:
        items:
          type: string
        type: array
      checked_at:
        type: string
        format: date-time
      template_path:
        type: string
        const: infra/modules/runtime-diagnostic-rbac.bicep
        default: infra/modules/runtime-diagnostic-rbac.bicep
    additionalProperties: false
    type: object
    required:
    - scope
    - tenant_id
    - subscription_id
    - resource_group
    - apim_name
    - probe_subscription_id
    - required_actions
    - checked_at
    title: RuntimeDiagnosticAccess
  RuntimeCheckPlan:
    properties:
      runtime_id:
        type: string
        format: uuid
      options:
        items:
          $ref: ../../openapi.yaml#/components/schemas/RuntimeCheckOption
        type: array
      unavailable_reason:
        type:
        - string
        - 'null'
      access:
        anyOf:
        - $ref: ../../openapi.yaml#/components/schemas/RuntimeDiagnosticAccess
        - type: 'null'
        oneOf:
        - $ref: ../../openapi.yaml#/components/schemas/RuntimeDiagnosticAccess
        - type: 'null'
      max_output_tokens:
        type: integer
        const: 64
        default: 64
      request_limit:
        type: integer
        const: 1
        default: 1
    additionalProperties: false
    type: object
    required:
    - runtime_id
    - options
    title: RuntimeCheckPlan
  RuntimeHealth:
    properties:
      runtime_id:
        type: string
        format: uuid
      status:
        $ref: ../../openapi.yaml#/components/schemas/HealthStatus
        enum:
        - unknown
        - available
        - unavailable
      message:
        type: string
      checked_at:
        type: string
        format: date-time
      check_kind:
        type: string
        enum:
        - legacy
        - model_inference
        default: legacy
      outcome:
        type:
        - string
        - 'null'
        enum:
        - passed
        - blocked
        - configuration_error
        - upstream_error
        - inconclusive
        - null
      selection:
        anyOf:
        - $ref: ../../openapi.yaml#/components/schemas/RuntimeCheckOption
        - type: 'null'
        oneOf:
        - $ref: ../../openapi.yaml#/components/schemas/RuntimeCheckOption
        - type: 'null'
      request_id:
        type:
        - string
        - 'null'
      correlation_id:
        type:
        - string
        - 'null'
      http_status:
        type:
        - integer
        - 'null'
      latency_ms:
        type:
        - integer
        - 'null'
      error_code:
        type:
        - string
        - 'null'
      valid_until:
        description: Legacy expiry; historical diagnostic outcomes do not expire.
        type:
        - string
        - 'null'
        format: date-time
      configuration_fingerprint:
        description: Server-owned digest of persisted call configuration, not secrets.
        type:
        - string
        - 'null'
        maxLength: 80
      configuration_status:
        type: string
        enum:
        - current
        - changed
        - unverified
        description: Configuration comparison, not current availability.
        default: unverified
      configuration_checked_at:
        type:
        - string
        - 'null'
        format: date-time
    additionalProperties: false
    type: object
    required:
    - runtime_id
    - status
    - message
    - checked_at
    title: RuntimeHealth
  MultiTargetPublicationChildCreate:
    properties:
      publication:
        $ref: ../../openapi.yaml#/components/schemas/GatewayPublicationCreate
      required:
        type: boolean
        title: Required
        default: true
    additionalProperties: false
    type: object
    required:
    - publication
    title: MultiTargetPublicationChildCreate
  MultiTargetPublicationCreate:
    properties:
      children:
        items:
          $ref: ../../openapi.yaml#/components/schemas/MultiTargetPublicationChildCreate
        type: array
        maxItems: 20
        minItems: 2
        title: Children
    additionalProperties: false
    type: object
    required:
    - children
    title: MultiTargetPublicationCreate
  MultiTargetPublicationRequestAccepted:
    properties:
      rollout:
        $ref: ../../openapi.yaml#/components/schemas/MultiTargetRollout
      publications:
        items:
          $ref: ../../openapi.yaml#/components/schemas/GatewayPublicationView
        type: array
        title: Publications
      status_url:
        type: string
        title: Status Url
    additionalProperties: false
    type: object
    required:
    - rollout
    - publications
    - status_url
    title: MultiTargetPublicationRequestAccepted
  GatewayProfileNameWrite:
    properties:
      name:
        type: string
        maxLength: 120
        minLength: 1
        pattern: \S
    additionalProperties: false
    type: object
    required:
    - name
    title: GatewayProfileNameWrite
  ImageGenerationLimits:
    properties:
      max_request_bytes:
        type: integer
        maximum: 16777216.0
        minimum: 1.0
      max_response_bytes:
        type: integer
        maximum: 16777216.0
        minimum: 1.0
      output_reservation_tokens:
        type: integer
        maximum: 2147483647.0
        minimum: 1.0
      timeout_seconds:
        type: integer
        maximum: 240.0
        minimum: 1.0
    additionalProperties: false
    type: object
    required:
    - max_request_bytes
    - max_response_bytes
    - output_reservation_tokens
    - timeout_seconds
    title: ImageGenerationLimits
    description: Immutable published transport and reservation limits, not provider parameter defaults.
  ImageGenerationProfile:
    type: object
    additionalProperties: false
    required:
    - id
    - version
    - display_name
    - provider_kind
    - provider_model
    - protocol
    - api_version
    - backend_path
    - public_path
    - usage_format
    - max_request_bytes
    - max_response_bytes
    - output_reservation_tokens
    - timeout_seconds
    description: Content-addressed v4 snapshot attached to an effective publication, not mutable registry
      metadata.
    properties:
      id:
        type: string
        pattern: ^sha256:[a-f0-9]{64}$
      version:
        type: integer
        const: 4
      display_name:
        type: string
        minLength: 1
      provider_kind:
        type: string
        const: microsoft_foundry
      provider_model:
        type: string
        minLength: 1
      protocol:
        type: string
        const: openai_images
      api_version:
        type: string
        const: preview
      backend_path:
        type: string
        const: /openai/v1/images/generations
      public_path:
        type: string
        const: /images/generations
      usage_format:
        type: string
        const: text-input-image-output-v1
      max_request_bytes:
        type: integer
        minimum: 1
        maximum: 16777216
      max_response_bytes:
        type: integer
        minimum: 1
        maximum: 16777216
      output_reservation_tokens:
        type: integer
        minimum: 1
        maximum: 2147483647
      timeout_seconds:
        type: integer
        minimum: 1
        maximum: 240
  ImageInvocationMetadata:
    type: object
    additionalProperties: false
    required:
    - organization_id
    - organization
    - department_id
    - department
    - project_id
    - project
    - agent_id
    - agent
    - user_id
    - user
    - workflow
    - model_id
    - model
    - runtime
    - request_source
    - run_id
    properties:
      organization_id:
        type: string
        minLength: 1
        maxLength: 255
      organization:
        type: string
        minLength: 1
        maxLength: 255
      department_id:
        type: string
        minLength: 1
        maxLength: 255
      department:
        type: string
        minLength: 1
        maxLength: 255
      project_id:
        type: string
        minLength: 1
        maxLength: 255
      project:
        type: string
        minLength: 1
        maxLength: 255
      agent_id:
        type: string
        minLength: 1
        maxLength: 255
      agent:
        type: string
        minLength: 1
        maxLength: 255
      user_id:
        type: string
        minLength: 1
        maxLength: 255
      user:
        type: string
        minLength: 1
        maxLength: 255
      workflow:
        type: string
        minLength: 1
        maxLength: 255
      model_id:
        type: string
        minLength: 1
        maxLength: 255
      model:
        type: string
        minLength: 1
        maxLength: 255
      runtime:
        type: string
