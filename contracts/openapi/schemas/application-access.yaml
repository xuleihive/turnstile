  GatewayApplicationSubscriptionCreate:
    properties:
      subscription_id:
        type: string
        maxLength: 127
        minLength: 1
        pattern: ^[a-z0-9][a-z0-9-]{0,126}$
      display_name:
        type: string
        maxLength: 100
        minLength: 1
      description:
        type:
