      person_id:
        anyOf:
        - type: string
        - type: 'null'
        title: Person Id
      person_name:
        anyOf:
        - type: string
        - type: 'null'
        title: Person Name
      person_assignment_supported:
        type: boolean
        title: Person Assignment Supported
        default: false
      governance_write_available:
        type: boolean
        title: Governance Write Available
        default: true
      subscription_count:
        type: integer
