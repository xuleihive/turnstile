schemas:
  GatewayApplicationUsage:
    properties:
      request_count:
        type: integer
        minimum: 0.0
        default: 0
      denied_request_count:
        type: integer
        minimum: 0.0
        default: 0
      input_tokens:
        type: integer
        minimum: 0.0
        default: 0
      cached_tokens:
        type: integer
        minimum: 0.0
        default: 0
      cache_write_tokens:
        type: integer
        minimum: 0.0
        default: 0
      output_tokens:
        type: integer
        minimum: 0.0
        default: 0
      total_tokens:
        type: integer
        minimum: 0.0
        default: 0
      estimated_cost:
        type: number
        minimum: 0.0
        default: 0
      usd_cost:
        anyOf:
        - type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,16}|(?=[\d.]{1,31}0*$)\d{0,16}\.\d{0,14}0*$)
        - type: 'null'
      unpriced_usage_count:
        type: integer
        minimum: 0.0
        default: 0
      last_request_at:
        type:
        - string
        - 'null'
        format: date-time
    additionalProperties: false
    type: object
    title: GatewayApplicationUsage
  GatewayApplicationUserUsage:
    properties:
      user_id:
        type: string
      display_name:
        type: string
      actor_type:
        type: string
        enum:
        - person
        - service
        - system
      person_id:
        type:
        - string
        - 'null'
      request_count:
        type: integer
        minimum: 0.0
      denied_request_count:
        type: integer
        minimum: 0.0
      total_tokens:
        type: integer
        minimum: 0.0
      estimated_cost:
        type: number
        minimum: 0.0
      last_request_at:
        type: string
        format: date-time
    additionalProperties: false
    type: object
    required:
    - user_id
    - display_name
    - actor_type
    - request_count
    - denied_request_count
    - total_tokens
    - estimated_cost
    - last_request_at
    title: GatewayApplicationUserUsage
  GatewayApplicationBudget:
    properties:
      period_start:
        type: string
        format: date
      budget_mode:
        type: string
        enum:
        - tokens
        - usd
        default: tokens
      token_limit:
        anyOf:
        - type: integer
          minimum: 0.0
        - type: 'null'
        minimum: 0
      usd_limit:
        anyOf:
        - type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,16}|(?=[\d.]{1,19}0*$)\d{0,16}\.\d{0,2}0*$)
        - type: 'null'
      tokens_per_minute:
        type: integer
        exclusiveMinimum: 0.0
      enforce:
        type: boolean
      warning_threshold_percent:
        type: integer
        maximum: 100.0
        minimum: 1.0
      used_tokens:
        type: integer
        minimum: 0.0
        default: 0
      remaining_tokens:
        anyOf:
        - type: integer
          minimum: 0.0
        - type: 'null'
        minimum: 0
      used_usd:
        anyOf:
        - type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,16}|(?=[\d.]{1,31}0*$)\d{0,16}\.\d{0,14}0*$)
        - type: 'null'
      remaining_usd:
        anyOf:
        - type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,16}|(?=[\d.]{1,31}0*$)\d{0,16}\.\d{0,14}0*$)
        - type: 'null'
      usd_cost_available:
        anyOf:
        - type: boolean
        - type: 'null'
      usage_percent:
        type: number
        minimum: 0.0
      pending_reserved_tokens:
        type:
        - integer
        - 'null'
        minimum: 0
      finalized_upper_bound_tokens:
        type:
        - integer
        - 'null'
        minimum: 0
      finalized_upper_bound_count:
        type:
        - integer
        - 'null'
        minimum: 0
      pending_reservation_count:
        type:
        - integer
        - 'null'
        minimum: 0
      stale_reservation_count:
        type:
        - integer
        - 'null'
        minimum: 0
      oldest_reservation_at:
        type:
        - string
        - 'null'
        format: date-time
      available_tokens:
        type:
        - integer
        - 'null'
        minimum: 0
      ledger_snapshot_at:
        type:
        - string
        - 'null'
        format: date-time
      ledger_source:
        type: string
        enum:
        - snapshot
        - execution
        default: snapshot
      ledger_status:
        type: string
        enum:
        - snapshot
        - current
        - unavailable
        - prepared
        default: snapshot
      ledger_read_at:
        type:
        - string
        - 'null'
        format: date-time
      ledger_version:
        type:
        - integer
        - 'null'
        minimum: 0
      ledger_balance_tokens:
        type:
        - integer
        - 'null'
      pending_reserved_usd:
        anyOf:
        - type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,16}|(?=[\d.]{1,31}0*$)\d{0,16}\.\d{0,14}0*$)
        - type: 'null'
      finalized_upper_bound_usd:
        anyOf:
        - type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,16}|(?=[\d.]{1,31}0*$)\d{0,16}\.\d{0,14}0*$)
        - type: 'null'
      policy_pending:
        type: boolean
        default: false
      projected_tokens_per_minute:
        type:
        - integer
        - 'null'
        maximum: 2147483647
        exclusiveMinimum: 0.0
        minimum: 1
      tpm_sync_status:
        type: string
        enum:
        - projected
        - pending
        - unavailable
        default: unavailable
      updated_by:
        type: string
      updated_at:
        type: string
        format: date-time
    additionalProperties: false
    type: object
    required:
    - period_start
    - tokens_per_minute
    - enforce
    - warning_threshold_percent
    - usage_percent
    - updated_by
    - updated_at
    title: GatewayApplicationBudget
  GatewayApplicationBudgetUpdate:
    properties:
      budget_mode:
        type: string
        enum:
        - tokens
        - usd
        default: tokens
      token_limit:
        anyOf:
        - type: integer
          exclusiveMinimum: 0.0
        - type: 'null'
        minimum: 1
      usd_limit:
        anyOf:
        - type: number
          exclusiveMinimum: 0.0
        - type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,16}|(?=[\d.]{1,19}0*$)\d{0,16}\.\d{0,2}0*$)
        - type: 'null'
      tokens_per_minute:
        type: integer
        maximum: 2147483647
        exclusiveMinimum: 0.0
      enforce:
        type: boolean
      warning_threshold_percent:
        type: integer
        maximum: 100.0
        minimum: 1.0
    additionalProperties: false
    type: object
    required:
    - tokens_per_minute
    - enforce
    - warning_threshold_percent
    title: GatewayApplicationBudgetUpdate
  GatewayApplicationModelAccessUpdate:
    properties:
      mode:
        type: string
        enum:
        - unrestricted
        - restricted
      model_ids:
        items:
          type: string
          format: uuid
        type: array
    additionalProperties: false
    type: object
    required:
    - mode
    title: GatewayApplicationModelAccessUpdate
  GatewayApplicationSubscription:
    properties:
      id:
        type: string
        format: uuid
      application_id:
        type: string
        format: uuid
      gateway_profile_id:
        type: string
        format: uuid
      apim_subscription_id:
        type: string
      display_name:
        type: string
      scope_type:
        type: string
        enum:
        - product
        - api
        - service
      scope_id:
        type: string
      state:
        type: string
        enum:
        - active
        - suspended
        - cancelled
      scope_exists:
        type: boolean
      source:
        type: string
        enum:
        - bicep
        - discovered
        - managed
      discovered_at:
        type: string
        format: date-time
      last_synced_at:
        type: string
        format: date-time
    additionalProperties: false
    type: object
    required:
    - id
    - application_id
    - gateway_profile_id
    - apim_subscription_id
    - display_name
    - scope_type
    - scope_id
    - state
    - scope_exists
    - source
    - discovered_at
    - last_synced_at
    title: GatewayApplicationSubscription
  GatewayApplicationSubscriptionKeySecret:
    properties:
      key_kind:
        type: string
        enum:
        - primary
        - secondary
      value:
        type: string
        maxLength: 256
        minLength: 1
    additionalProperties: false
    type: object
    required:
    - key_kind
    - value
    title: GatewayApplicationSubscriptionKeySecret
  GatewayApplicationSubscriptionKeyRotation:
    properties:
      confirmation:
        type: string
        maxLength: 256
        minLength: 1
    additionalProperties: false
    type: object
    required:
    - confirmation
    title: GatewayApplicationSubscriptionKeyRotation
  GatewayApplicationAuditEvent:
    properties:
      id:
        type: string
        format: uuid
      application_id:
        type: string
        format: uuid
      operation:
        type: string
        enum:
        - created
        - adopted
        - updated
        - budget_updated
        - models_updated
        - subscription_synced
        - suspended
        - resumed
        - retired
      before_state:
        type:
        - object
        - 'null'
        additionalProperties: true
      after_state:
        type:
        - object
        - 'null'
        additionalProperties: true
      actor:
        type: string
      created_at:
        type: string
        format: date-time
    additionalProperties: false
    type: object
    required:
    - id
    - application_id
    - operation
    - before_state
    - after_state
    - actor
    - created_at
    title: GatewayApplicationAuditEvent
  GatewayApplicationAvatarUpdate:
    properties:
      avatar_data_url:
        type:
        - string
        - 'null'
        maxLength: 90000
        description: Base64 PNG, JPEG, or WebP data URL; null removes the avatar.
    additionalProperties: false
    type: object
    title: GatewayApplicationAvatarUpdate
  GatewayApplicationAvatar:
    properties:
      avatar_url:
        type:
        - string
        - 'null'
      updated_at:
        type:
        - string
        - 'null'
        format: date-time
    additionalProperties: false
    type: object
    required:
    - avatar_url
    - updated_at
    title: GatewayApplicationAvatar
  GatewayApplicationSummary:
