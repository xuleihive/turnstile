schemas:
  BrandKey:
    type: string
    enum:
    - generic
    - amazon_bedrock
    - anthropic
    - azure_databricks
    - github
    - microsoft
    - microsoft_foundry
    - openai
    title: BrandKey
  BudgetScopeType:
    type: string
    enum:
    - organization
    - department
    - user
  AssistantTurn:
    properties:
      role:
        type: string
        enum:
        - user
        - assistant
      content:
        type: string
        maxLength: 20000
        minLength: 1
    additionalProperties: false
    type: object
    required:
    - role
    - content
    title: AssistantTurn
  AssistantAskRequest:
    properties:
      question:
        type: string
        maxLength: 4000
        minLength: 1
      history:
        items:
          $ref: ../../openapi.yaml#/components/schemas/AssistantTurn
        type: array
        maxItems: 20
        description: 'Prior text turns only. Charts are deliberately not replayed through the context

          window, so a long conversation does not grow unboundedly.

          '
      conversation_id:
        type:
        - string
        - 'null'
        maxLength: 64
        minLength: 1
      timezone:
        type: string
        maxLength: 64
        minLength: 1
        default: UTC
      locale:
        type: string
        maxLength: 16
        minLength: 2
        default: en
    additionalProperties: false
    type: object
    required:
    - question
    title: AssistantAskRequest
  AssistantStep:
    properties:
      sequence:
        type: integer
        minimum: 1.0
      tool:
        type: string
      arguments:
        additionalProperties: true
        type: object
      status:
        type: string
        enum:
        - ok
        - error
      summary:
        type: string
        maxLength: 500
      row_count:
        type: integer
        minimum: 0.0
        default: 0
    additionalProperties: false
    type: object
    required:
    - sequence
    - tool
    - arguments
    - status
    - summary
    title: AssistantStep
    description: One tool call, surfaced so an answer can be audited.
  AssistantReply:
    properties:
      conversation_id:
        type: string
      message:
        type: string
      charts:
        items:
          $ref: ../../openapi.yaml#/components/schemas/ChartSpec
        type: array
      steps:
        items:
          $ref: ../../openapi.yaml#/components/schemas/AssistantStep
        type: array
      latency_ms:
        type: integer
        minimum: 0.0
      model:
        type: string
      total_tokens:
        type: integer
        minimum: 0.0
        default: 0
        description: 'The assistant''s own spend. It calls the same gateway as every other caller and

          is attributed in the dashboard it analyses.

          '
    additionalProperties: false
    type: object
    required:
    - conversation_id
    - message
    - charts
    - steps
    - latency_ms
    - model
    title: AssistantReply
  ChartSeries:
    properties:
      key:
        type: string
        maxLength: 64
        minLength: 1
      label:
        type: string
        maxLength: 120
        minLength: 1
    additionalProperties: false
    type: object
    required:
    - key
    - label
    title: ChartSeries
  ChartQuery:
    properties:
      tool:
        type: string
        maxLength: 64
        minLength: 1
      arguments:
        additionalProperties: true
        type: object
    additionalProperties: false
    type: object
    required:
    - tool
    - arguments
    title: ChartQuery
    description: 'Everything needed to reproduce a chart, and nothing else. `arguments` has already

      been validated against the tool''s own argument model, so replaying it cannot widen

      what the original question was allowed to read. No SQL is ever persisted.

      '
  ChartSpec:
    properties:
      id:
        type: string
        maxLength: 64
        minLength: 1
      kind:
        type: string
        enum:
        - bar
        - line
        - table
        - kpi
      title:
        type: string
        maxLength: 200
        minLength: 1
      time_range_label:
        type: string
        maxLength: 120
        minLength: 1
      basis:
        type: string
        maxLength: 400
        minLength: 1
      unit:
        type: string
        maxLength: 60
      category_key:
        type: string
        maxLength: 64
        minLength: 1
      category_label:
        type: string
        maxLength: 120
        minLength: 1
      series:
        items:
          $ref: ../../openapi.yaml#/components/schemas/ChartSeries
        type: array
        maxItems: 12
        minItems: 1
      rows:
        items:
          additionalProperties: true
          type: object
        type: array
        maxItems: 500
      generated_at:
        type: string
        format: date-time
      range_start:
        type:
        - string
        - 'null'
        format: date
        description: 'The first calendar day this chart covered. Present so pinning can freeze a

          relative preset onto the window the reader saw; absent on charts stored before

          it existed, which keep resolving their preset on every refresh.

          '
      range_end:
        type:
        - string
        - 'null'
        format: date
        description: The last calendar day covered, inclusive.
      query:
        $ref: ../../openapi.yaml#/components/schemas/ChartQuery
    additionalProperties: false
    type: object
    required:
    - id
    - kind
    - title
    - time_range_label
    - basis
    - unit
    - category_key
    - category_label
    - series
    - rows
    - generated_at
    - query
    title: ChartSpec
  ConversationSummary:
    properties:
      id:
        type: string
        format: uuid
      title:
        type: string
        description: The label shown in the history list. See `title_source`.
      title_source:
        type: string
        enum:
        - question
        - model
        - user
        default: question
        description: 'Where the title came from, and therefore whether it may be replaced.

          `question` is the placeholder taken from the first question and is the only

          value the title endpoint will overwrite; `model` and `user` are final.

          '
      owner_id:
        type: string
      turn_count:
        type: integer
        minimum: 0.0
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
    additionalProperties: false
    type: object
    required:
    - id
    - title
    - owner_id
    - turn_count
    - created_at
    - updated_at
    title: ConversationSummary
    description: 'A row in the history dropdown.


      Carries no turns: the dropdown lists conversations and would otherwise download every

      transcript, including their charts, to render a list of titles.'
  ConversationExchange:
    properties:
      position:
        type: integer
        minimum: 0.0
      question:
        type: string
      reply:
        $ref: ../../openapi.yaml#/components/schemas/AssistantReply
      created_at:
        type: string
        format: date-time
    additionalProperties: false
    type: object
    required:
    - position
    - question
    - reply
    - created_at
    title: ConversationExchange
    description: One question and the reply it produced, as it was shown at the time.
  Conversation:
    properties:
      id:
        type: string
        format: uuid
        title: Id
      title:
        type: string
        title: Title
      title_source:
        type: string
        enum:
        - question
        - model
        - user
        title: Title Source
        default: question
      owner_id:
        type: string
        title: Owner Id
      turn_count:
        type: integer
        minimum: 0.0
        title: Turn Count
      created_at:
        type: string
        format: date-time
        title: Created At
      updated_at:
        type: string
        format: date-time
        title: Updated At
      exchanges:
        items:
          $ref: ../../openapi.yaml#/components/schemas/ConversationExchange
        type: array
        title: Exchanges
    additionalProperties: false
    type: object
    required:
    - id
    - title
    - owner_id
    - turn_count
    - created_at
    - updated_at
    title: Conversation
    allOf:
    - $ref: ../../openapi.yaml#/components/schemas/ConversationSummary
    - type: object
      required:
      - exchanges
      properties:
        exchanges:
          type: array
          items:
            $ref: ../../openapi.yaml#/components/schemas/ConversationExchange
  ConversationList:
    properties:
      items:
        items:
          $ref: ../../openapi.yaml#/components/schemas/ConversationSummary
        type: array
    additionalProperties: false
    type: object
    required:
    - items
    title: ConversationList
  ConversationRename:
    properties:
      title:
        type: string
        maxLength: 200
        minLength: 1
    additionalProperties: false
    type: object
    required:
    - title
    title: ConversationRename
  ConversationTitleRequest:
    properties:
      locale:
        type: string
        maxLength: 16
        minLength: 2
        default: en
        description: 'The language to write the title in. This is the reader''s current UI locale,

          not the one the conversation was held in, because the title is read now.

          '
    additionalProperties: false
    type: object
    title: ConversationTitleRequest
    description: 'Ask the model to name a conversation.


      The locale is the reader''s current one rather than the one the conversation was held

      in, because the title is read now, in the sidebar they are looking at now.'
  Error:
    type: object
    additionalProperties: false
    required:
    - code
    - message
    - request_id
    properties:
      code:
        type: string
      message:
        type: string
      request_id:
        type: string
  AuthStrategy:
    type: string
    enum:
    - none
    - managed_identity
    - named_value_bearer
    - named_value_api_key
    - oauth_client_credentials
    title: AuthStrategy
  AuthType:
    type: string
    enum:
    - none
    - api_key
    - bearer
    - azure_ad
    title: AuthType
  BudgetPriceProjection:
    properties:
      version:
        type: integer
        const: 1
        title: Version
        default: 1
      model_id:
        type: string
        format: uuid
        title: Model Id
      price_sha256:
        type: string
        pattern: ^[0-9a-f]{64}$
        title: Price Sha256
      price:
        anyOf:
        - $ref: ../../openapi.yaml#/components/schemas/ModelPrice
        - type: 'null'
      rate_schedules:
        items:
          additionalProperties:
            anyOf:
            - type: integer
            - type: 'null'
          type: object
        type: array
        title: Rate Schedules
      updated_at:
        type: string
        format: date-time
        title: Updated At
    additionalProperties: false
    type: object
    required:
    - model_id
    - price_sha256
    - price
    - updated_at
    title: BudgetPriceProjection
    description: Current accepted model price projected separately from route publications.
  BudgetReservationResolution:
    properties:
      version:
        type: integer
        const: 1
        title: Version
        default: 1
      id:
        type: string
        format: uuid
        title: Id
      receipt:
        $ref: ../../openapi.yaml#/components/schemas/LedgerAdmissionReceipt-Output
      decision:
        type: string
        const: release_unverified
        title: Decision
        default: release_unverified
      actor:
        type: string
        maxLength: 255
        minLength: 1
        title: Actor
      reason:
        type: string
        enum:
        - gateway_validation_failure
        - provider_result_unavailable
        - evidence_irrecoverable
        title: Reason
      evidence_sha256:
        type: string
        pattern: ^[0-9a-f]{64}$
        title: Evidence Sha256
      approved_at:
        type: string
        format: date-time
        title: Approved At
    additionalProperties: false
    type: object
    required:
    - id
    - receipt
    - actor
    - reason
    - evidence_sha256
    - approved_at
    title: BudgetReservationResolution
  BudgetReservationResolutionWrite:
    properties:
      id:
        type: string
        format: uuid
        title: Id
      receipt:
        $ref: ../../openapi.yaml#/components/schemas/LedgerAdmissionReceipt-Input
      reason:
        type: string
        enum:
        - gateway_validation_failure
        - provider_result_unavailable
        - evidence_irrecoverable
        title: Reason
      evidence_sha256:
        type: string
        pattern: ^[0-9a-f]{64}$
        title: Evidence Sha256
      accepts_late_usage:
        type: boolean
        const: true
        title: Accepts Late Usage
    additionalProperties: false
    type: object
    required:
    - id
    - receipt
    - reason
    - evidence_sha256
    - accepts_late_usage
    title: BudgetReservationResolutionWrite
  ChatMessage:
    properties:
      role:
        type: string
        enum:
        - system
        - user
        - assistant
        - tool
        title: Role
      content:
        anyOf:
        - type: string
          maxLength: 200000
        - type: 'null'
        title: Content
      tool_calls:
        anyOf:
        - items:
            $ref: ../../openapi.yaml#/components/schemas/ToolCall
          type: array
          maxItems: 20
        - type: 'null'
        title: Tool Calls
      tool_call_id:
        anyOf:
        - type: string
          maxLength: 255
          minLength: 1
        - type: 'null'
        title: Tool Call Id
    additionalProperties: false
    type: object
    required:
    - role
    title: ChatMessage
    description: 'One turn in an OpenAI-shaped conversation.


      `content` is optional because an assistant turn that only calls tools carries no

      text, and a `tool` turn carries the result of exactly one call. The validator below

      is what keeps that from degrading into "any field may be missing".'
  ChoiceQuestion:
    properties:
      type:
        type: string
        const: choice
        title: Type
      instructions:
        type: string
        minLength: 1
        title: Instructions
      criteria:
        additionalProperties:
          type: string
          minLength: 1
        type: object
        minProperties: 2
        title: Criteria
    additionalProperties: false
    type: object
    required:
    - type
    - instructions
    - criteria
    title: ChoiceQuestion
  ConnectionAuthMode:
    type: string
    enum:
    - managed_identity
    - api_key
    - oauth_m2m
    title: ConnectionAuthMode
  DecisionInvocationRequest:
    properties:
      state:
        $ref: ../../openapi.yaml#/components/schemas/JsonValue
      questions:
        additionalProperties:
          oneOf:
          - $ref: ../../openapi.yaml#/components/schemas/NoulQuestion
          - $ref: ../../openapi.yaml#/components/schemas/ChoiceQuestion
          - $ref: ../../openapi.yaml#/components/schemas/ScoreQuestion
          discriminator:
            propertyName: type
            mapping:
                choice: ../../openapi.yaml#/components/schemas/ChoiceQuestion
                noul: ../../openapi.yaml#/components/schemas/NoulQuestion
                score: ../../openapi.yaml#/components/schemas/ScoreQuestion
        type: object
        minProperties: 1
        title: Questions
      metadata:
        $ref: ../../openapi.yaml#/components/schemas/InvocationMetadata
      model_id:
        type: string
        format: uuid
        title: Model Id
      runtime_id:
        anyOf:
        - type: string
          format: uuid
        - type: 'null'
        title: Runtime Id
      gateway_profile_id:
        anyOf:
        - type: string
          format: uuid
        - type: 'null'
        title: Gateway Profile Id
      gateway_deployment_id:
        anyOf:
        - type: string
          format: uuid
        - type: 'null'
        title: Gateway Deployment Id
    additionalProperties: false
    type: object
    required:
    - state
    - questions
    - metadata
    - model_id
    title: DecisionInvocationRequest
  DecisionInvocationResponse:
    properties:
      request_id:
        type: string
        title: Request Id
      correlation_id:
        anyOf:
        - type: string
        - type: 'null'
        title: Correlation Id
      upstream_request_id:
        anyOf:
        - type: string
        - type: 'null'
        title: Upstream Request Id
      answers:
        additionalProperties:
          $ref: ../../openapi.yaml#/components/schemas/JsonValue
        type: object
        title: Answers
      provider:
        type: string
        title: Provider
      runtime:
        type: string
        title: Runtime
      model:
        type: string
        title: Model
      gateway:
        type: string
        title: Gateway
      gateway_profile_id:
        anyOf:
        - type: string
          format: uuid
        - type: 'null'
        title: Gateway Profile Id
      gateway_deployment_id:
        anyOf:
        - type: string
          format: uuid
        - type: 'null'
        title: Gateway Deployment Id
      native_gateway_id:
        anyOf:
        - type: string
        - type: 'null'
        title: Native Gateway Id
      latency_ms:
        type: integer
        minimum: 0.0
        title: Latency Ms
      usage:
        anyOf:
        - $ref: ../../openapi.yaml#/components/schemas/InvocationUsage
        - type: 'null'
      estimated_cost:
        anyOf:
        - type: number
          minimum: 0.0
        - type: 'null'
        title: Estimated Cost
    additionalProperties: false
    type: object
    required:
    - request_id
    - answers
    - provider
    - runtime
    - model
    - gateway
    - latency_ms
    - usage
    title: DecisionInvocationResponse
  DepartmentEnforcementWrite:
    properties:
      mode:
        type: string
        enum:
        - block
        - audit
        title: Mode
    additionalProperties: false
    type: object
    required:
    - mode
    title: DepartmentEnforcementWrite
  DistributionBreakdown:
    properties:
      id:
        type: string
        title: Id
      name:
        type: string
        title: Name
      total_tokens:
        type: integer
        minimum: 0.0
        title: Total Tokens
      total_requests:
        type: integer
        minimum: 0.0
        title: Total Requests
    additionalProperties: false
    type: object
    required:
    - id
    - name
    - total_tokens
    - total_requests
    title: DistributionBreakdown
    description: 'One slice of a ranking row, used to stack a second dimension inside the first.


      Deliberately narrower than `DistributionItem`: a stacked bar needs volume, not tail

      latency or a failure split, and computing percentiles for every parent-child pair would

      cost far more than the chart can show.'
  DistributionItem:
    properties:
      total_tokens:
        type: integer
        minimum: 0.0
        title: Total Tokens
      cache_read_tokens:
        type: integer
        minimum: 0.0
        title: Cache Read Tokens
        default: 0
      total_requests:
        type: integer
        minimum: 0.0
        title: Total Requests
      estimated_cost:
        type: number
        minimum: 0.0
        title: Estimated Cost
      average_latency_ms:
        type: number
        minimum: 0.0
        title: Average Latency Ms
      error_rate:
        type: number
        maximum: 100.0
        minimum: 0.0
        title: Error Rate
      p50_latency_ms:
        type: number
        minimum: 0.0
        title: P50 Latency Ms
        default: 0.0
      p95_latency_ms:
        type: number
        minimum: 0.0
        title: P95 Latency Ms
        default: 0.0
      p99_latency_ms:
        type: number
        minimum: 0.0
        title: P99 Latency Ms
        default: 0.0
      success_requests:
        type: integer
        minimum: 0.0
        title: Success Requests
        default: 0
      client_error_requests:
        type: integer
        minimum: 0.0
        title: Client Error Requests
        default: 0
      server_error_requests:
        type: integer
        minimum: 0.0
        title: Server Error Requests
        default: 0
      latency_under_1s:
        type: integer
        minimum: 0.0
        title: Latency Under 1S
        default: 0
      latency_1_to_2s:
        type: integer
        minimum: 0.0
        title: Latency 1 To 2S
        default: 0
      latency_2_to_5s:
        type: integer
        minimum: 0.0
        title: Latency 2 To 5S
        default: 0
      latency_over_5s:
        type: integer
        minimum: 0.0
        title: Latency Over 5S
        default: 0
      id:
        type: string
        title: Id
      name:
        type: string
        title: Name
      share_percent:
        type: number
        maximum: 100.0
        minimum: 0.0
        title: Share Percent
      breakdown:
        items:
          $ref: ../../openapi.yaml#/components/schemas/DistributionBreakdown
        type: array
        title: Breakdown
    additionalProperties: false
    type: object
    required:
    - total_tokens
    - total_requests
    - estimated_cost
    - average_latency_ms
    - error_rate
    - id
    - name
    - share_percent
    title: DistributionItem
    description: 'One ranking row. Inherits the window metrics so a dimension carries the same tail

      latency and failure split as the window total, and so adding a metric is one edit

      rather than two that can drift apart. The frontend type has always been

      `ExecutiveTotals & { id, name, share_percent }`; this makes the backend agree.'
  DistributionResponse:
    properties:
      from:
        type: string
        format: date-time
        title: From
      to:
        type: string
        format: date-time
        title: To
      dimension:
        type: string
        title: Dimension
      items:
        items:
          $ref: ../../openapi.yaml#/components/schemas/DistributionItem
        type: array
        title: Items
    additionalProperties: false
    type: object
    required:
    - from
    - to
    - dimension
    - items
    title: DistributionResponse
  EnterpriseEntity:
    properties:
      id:
        type: string
        title: Id
      name:
        type: string
        title: Name
      parent_id:
        anyOf:
        - type: string
        - type: 'null'
        title: Parent Id
    additionalProperties: false
    type: object
    required:
    - id
    - name
    title: EnterpriseEntity
  EnterpriseEntityCatalog:
    properties:
      organizations:
        items:
          $ref: ../../openapi.yaml#/components/schemas/EnterpriseEntity
        type: array
        title: Organizations
      departments:
        items:
          $ref: ../../openapi.yaml#/components/schemas/EnterpriseEntity
        type: array
        title: Departments
      projects:
        items:
          $ref: ../../openapi.yaml#/components/schemas/EnterpriseEntity
        type: array
        title: Projects
      agents:
        items:
          $ref: ../../openapi.yaml#/components/schemas/EnterpriseEntity
        type: array
        title: Agents
      users:
        items:
          $ref: ../../openapi.yaml#/components/schemas/EnterpriseEntity
        type: array
        title: Users
      invocation_testers:
        items:
          $ref: ../../openapi.yaml#/components/schemas/EnterpriseEntity
        type: array
        title: Invocation Testers
    additionalProperties: false
    type: object
    required:
    - organizations
    - departments
    - projects
    - agents
    - users
    title: EnterpriseEntityCatalog
  ExecutiveChanges:
    properties:
      total_tokens:
        anyOf:
        - type: number
        - type: 'null'
        title: Total Tokens
      cache_read_tokens:
        anyOf:
        - type: number
        - type: 'null'
        title: Cache Read Tokens
      total_requests:
        anyOf:
        - type: number
        - type: 'null'
        title: Total Requests
      estimated_cost:
        anyOf:
        - type: number
        - type: 'null'
        title: Estimated Cost
      average_latency_ms:
        anyOf:
        - type: number
        - type: 'null'
        title: Average Latency Ms
      error_rate:
        anyOf:
        - type: number
        - type: 'null'
        title: Error Rate
      p50_latency_ms:
        anyOf:
        - type: number
        - type: 'null'
        title: P50 Latency Ms
      p95_latency_ms:
        anyOf:
        - type: number
        - type: 'null'
        title: P95 Latency Ms
      p99_latency_ms:
        anyOf:
        - type: number
        - type: 'null'
        title: P99 Latency Ms
      success_requests:
        anyOf:
        - type: number
        - type: 'null'
        title: Success Requests
      client_error_requests:
        anyOf:
        - type: number
        - type: 'null'
        title: Client Error Requests
      server_error_requests:
        anyOf:
        - type: number
        - type: 'null'
        title: Server Error Requests
      latency_under_1s:
        anyOf:
        - type: number
        - type: 'null'
        title: Latency Under 1S
      latency_1_to_2s:
        anyOf:
        - type: number
        - type: 'null'
        title: Latency 1 To 2S
      latency_2_to_5s:
        anyOf:
        - type: number
        - type: 'null'
        title: Latency 2 To 5S
      latency_over_5s:
        anyOf:
        - type: number
        - type: 'null'
        title: Latency Over 5S
    additionalProperties: false
    type: object
    required:
    - total_tokens
    - total_requests
    - estimated_cost
    - average_latency_ms
    - error_rate
    title: ExecutiveChanges
  ExecutiveOverviewResponse:
    properties:
      from:
        type: string
        format: date-time
        title: From
      to:
