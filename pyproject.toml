[project]
name = "turnstile"
version = "0.1.0"
description = "Governed AI gateway observability, budgets, and model operations"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "azure-functions==1.24.0",
    "cryptography==49.0.0",
    "pyjwt[crypto]==2.13.0",
    "fastapi==0.139.2",
    "httpx==0.28.1",
    "pillow==12.3.0",
    "psycopg[binary]==3.3.4",
    "psycopg-pool==3.3.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "uvicorn==0.51.0",
]

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
    # Only tests/platform/contracts/test_openapi.py needs it: the contract is YAML and the app
    # emits JSON,
    # so comparing them requires a parser. Dev-only, never shipped in the deployment zip.
    "pyyaml==6.0.3",
    "ruff==0.15.22",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["backend", "turnstile_core", "scripts", "tests"]
